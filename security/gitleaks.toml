# gitleaks configuration for openaliro.
#
# Run:
#   make security                      # tree scan on a branch, PR range in CI
#   scripts/security.sh secrets        # the same gate on its own
#   gitleaks detect -c security/gitleaks.toml --source . --log-opts=--all --redact
#
# Two things this file is deliberately NOT:
#
# 1. It is not a "long hex string" detector. This tree is mostly cryptographic firmware, so it
#    is full of legitimate long hex: AES S-boxes in tests/host/aes_ref.c, SHA-256 KATs in
#    ports/esp32/test/test_aliro_crypto.c, APDU vectors, and 65-byte P-256 public points in
#    .presence/enrolled. A rule matching hex by length would fire on every one of them, and a
#    gate that fires on everything is a gate everyone learns to bypass. The rules below match
#    key material by the NAME it is bound to, not by its shape.
#
# 2. It is not the control for the risk SECURITY.md actually names. That risk is a flight
#    recorder log embedding the session URSK, or a BLE capture carrying personal data, being
#    committed at all — and it is a question about which FILES exist, not about what regex their
#    bytes match. A .log or .pcapng is opaque to every rule here. That gate is the added-file
#    check in scripts/security-diff.sh, and the two are meant to be read together.
#
# The default ruleset is the useful half: it carries the entity-shaped detectors (GitHub tokens,
# AWS keys, PEM private key blocks, Slack and npm tokens) that no amount of local tuning would
# reproduce. Everything below extends it.

title = "openaliro"

[extend]
useDefault = true

[[rules]]
id = "openaliro-session-key-literal"
description = "Aliro/CCC session key material assigned a literal outside the test vectors"
# The named-binding form, deliberately narrow: a URSK, UPSK, UDSK, STS key or session key set
# from a hex or base64 literal. Derived at runtime everywhere it is legitimate, so a literal one
# is either a bench key that escaped, or a capture pasted into source.
regex = '''(?i)\b(ursk|upsk|udsk|sts_?key|session_?key|salted_?ursk)\b[^\n]{0,40}?["'`]([0-9a-fA-F]{32,}|[A-Za-z0-9+/]{24,}={0,2})["'`]'''
tags = ["openaliro", "key-material"]

[[rules]]
id = "openaliro-bench-identifier"
description = "Bench hardware identifier (J-Link probe serial) that .gitignore is meant to keep out"
# Nine digits bound to a J-Link mention. A bare nine-digit number is a date, a size, or a
# timestamp; the binding is what makes this precise enough to block on.
regex = '''(?i)(j-?link|segger)[^\n]{0,30}?\b\d{9}\b'''
tags = ["openaliro", "privacy", "bench"]

[[rules]]
id = "openaliro-absolute-home-path"
description = "Absolute path under a user home directory, which carries the developer's username"
# PRIVACY.md and the release process both care about this: Zephyr's __FILE__-based logging bakes
# build paths into the image, and a path pasted into a doc or a config leaks a real name. Build
# outputs are excluded below; this is about tracked source.
regex = '''(/Users/|/home/|C:\\Users\\)[A-Za-z0-9_.-]{2,}[/\\]'''
tags = ["openaliro", "privacy"]

# gitleaks compiles with Go's RE2, which has no negative lookahead, so the placeholder forms
# cannot be written as (?!…) inside the regex above. They are subtracted here instead. Keep the
# two in sync: a placeholder spelling that is not listed here reads as a real username and
# blocks the push.
#
# regexTarget = "match" is load-bearing and the default is wrong for this rule. Left at its
# default of "secret", gitleaks tests these patterns against the rule's capture group — here the
# bare `(/Users/|/home/)` alternation — which none of them can match, so the whole allowlist
# silently does nothing and every placeholder path reports as a leak. Verified both ways:
# "secret" lets /Users/Shared through as a finding, "match" does not.
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  # Placeholder forms, plus the directories macOS and Windows create under /Users themselves.
  # Shared, Guest and "Deleted Users" are system directories present on every machine and name
  # nobody: /Users/Shared in particular is the correct place to put a file for all accounts, so
  # it shows up in install instructions and is not a leak. Treating it as one cost a real
  # investigation here before someone read the actual value.
  '''(/Users/|/home/)(<[A-Za-z0-9_-]+>|\$[A-Za-z_][A-Za-z0-9_]*|\$\{[A-Za-z_][A-Za-z0-9_]*\}|USER|user|username|runner|you|me|name|linuxbrew|Shared|Guest|Deleted Users)[/\\]''',
  '''C:\\Users\\(<[A-Za-z0-9_-]+>|%[A-Za-z_]+%|USER|user|username|runner|Public|Default|All Users)\\''',
]

[allowlist]
description = "Paths whose long literals are test vectors, vendored code, or generated output"
paths = [
  '''^tests/host/aes_ref\.c$''',
  '''^tests/host/fuzz/corpus/''',
  '''^deps/''',
  '''^workspace/''',
  '''^build/''',
  '''^site/''',
  '''^node_modules/''',
  '''^docs/architecture/''',
  '''^web-twin/twin\.js$''',
  # Compiled Python. A .pyc embeds the absolute path of the source it was built from, so a tree
  # scan on a developer machine reports one absolute-home-path hit per cached module — twelve of
  # them here, every one an untracked artifact of having just run the test suite. They are
  # gitignored (.gitignore:14) and none is tracked, so the finding is real but the file is not
  # part of the repository. The deep lane's history scan is where a committed one would surface.
  '''__pycache__/''',
  '''\.pyc$''',
  # The repo-local virtualenv that scripts/toolchain.sh creates for markdown + coverage. Every
  # console script it generates starts with a shebang naming the absolute interpreter path, and
  # pyvenv.cfg records the home directory, so a tree scan reports one hit per script — thirteen
  # on a plain `make tools-install`. Untracked and gitignored, exactly like __pycache__ above.
  '''^\.venv/''',
  # Components the ESP component manager downloads into the app directory. `idf.py set-target`
  # fetches ~40 MB of third-party source here, and scanning it produced 1118 findings — ten times
  # the entire rest of the tree — every one of them somebody else's test vectors and example
  # keys. Gitignored (ports/esp32/apps/matter-lock/.gitignore:13) and never tracked, exactly like
  # __pycache__ and .venv above. Anything genuinely wrong with these is the `deps` gate's job.
  '''managed_components/''',
  '''^ports/esp32/apps/[^/]+/build[^/]*/''',
  # These four describe the patterns they detect, in prose and in regex form, so they match
  # themselves. Everything else under security/ and scripts/ is still scanned.
  '''^security/gitleaks\.toml$''',
  '''^security/semgrep-malicious\.yml$''',
  '''^scripts/security\.sh$''',
  '''^tests/tooling/security_diff_test\.sh$''',
  # KAT suites: published NIST/RFC vectors and Aliro spec APDUs, all public by construction.
  # Scoped to the test trees rather than to a global regex, so a key literal in shipping source
  # is still caught.
  '''^ports/esp32/test/''',
  '''^tests/host/test_.*\.c$''',
  '''^tests/host/twin_frames\.(c|h)$''',
]
