# Project-specific Semgrep rules for openaliro.
#
# These encode invariants that generic rulesets do not know about: this is access-control
# firmware with a hand-rolled key schedule, several wire parsers, and a hard real-time radio
# path. Registry rulesets (p/c, p/secrets, p/python, p/typescript) cover the generic classes
# and should be run alongside these, not replaced by them.
#
# Run:
#   make security                                  # this file plus the rest of the fast lane
#   semgrep scan --config=security/semgrep-openaliro.yml .
#
# Always name the config by its repo-relative path. Semgrep derives each rule's reported ID
# from the config path it was given, so an absolute path puts the checkout location — and on a
# developer machine, the username — into every finding, the SARIF, and the CI log.
#
# Precision notes are on each rule. Rules marked NOISY are expected to need triage; keep them
# because their false negatives are expensive, and tune the regex rather than deleting the rule.
#
# ERROR blocks a pull request, WARNING reports. That split is why severities here are not
# decorative: promoting a rule to ERROR makes it a merge gate, so promote it only once it has
# run clean over the tree. See security/README.md.

rules:

  # ---------------------------------------------------------------- C: crypto hygiene

  - id: openaliro-variable-time-compare-on-secret
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Variable-time memcmp on what looks like key, MAC, tag, or digest material. If an attacker
      can observe the timing and retry, this is an oracle. Use a constant-time comparison.
      Known instance: modules/woz_aliro/src/aliro_stepup.c compares a 32-byte hash this way.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**", "ports/esp32/test/**"]
    # The name regex carries two exclusions, both added after the first tree-wide run produced
    # three false positives out of four hits — an ERROR rule blocks merges, so a rule at that
    # severity has to earn it:
    #
    #   (?!.*pub)  a public key is not secret material. Comparing a derived P-256 public point
    #              against a stored one is an identity consistency check, and it was two of the
    #              three (ports/esp32/components/piv_ccid/piv_identity.c).
    #   key needs  bare `key` is almost always a lookup key, not key material. The third false
    #   an affix   positive was a CBOR map lookup comparing a field name
    #              (modules/woz_aliro_stack/src/protocol/access_document.c). Requiring an affix
    #              keeps session_key, key_buf and ursk while dropping the bare noun.
    #
    # Everything else — mac, digest, hash, sig, nonce, ursk — still matches bare, because those
    # nouns do not have an innocent reading in this codebase.
    pattern-either:
      - patterns:
          - pattern: memcmp($A, $B, $N)
          - metavariable-regex:
              metavariable: $A
              regex: (?i)^(?!.*pub)(?=.*(mac|tag|digest|hash|sig|hmac|cmac|secret|token|ursk|upsk|udsk|sts|nonce|challenge|proof|auth|[_a-z0-9]key|key[_a-z0-9])).*
      - patterns:
          - pattern: memcmp($A, $B, $N)
          - metavariable-regex:
              metavariable: $B
              regex: (?i)^(?!.*pub)(?=.*(mac|tag|digest|hash|sig|hmac|cmac|secret|token|ursk|upsk|udsk|sts|nonce|challenge|proof|auth|[_a-z0-9]key|key[_a-z0-9])).*

  - id: openaliro-non-cryptographic-rng
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Non-cryptographic RNG. Every nonce, ephemeral key, salt, and challenge in this codebase
      must come from a CSPRNG: psa_generate_random() on both targets, or sys_csrand_get() on
      Zephyr, or esp_random() on ESP32. sys_rand32_get() is explicitly NOT cryptographic.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**"]
    pattern-either:
      - pattern: rand()
      - pattern: srand(...)
      - pattern: random()
      - pattern: sys_rand32_get()
      - pattern: sys_rand_get(...)

  - id: openaliro-key-buffer-cleared-with-memset
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Key material zeroized with memset. A compiler may remove a memset to a buffer that is dead
      afterwards, leaving the secret on the stack. Use mbedtls_platform_zeroize(), explicit_bzero(),
      or a volatile write. NOISY where the buffer is not actually secret; triage by name.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**"]
    patterns:
      - pattern: memset($BUF, 0, $N)
      - metavariable-regex:
          metavariable: $BUF
          regex: (?i).*(key|secret|priv|seed|ikm|prk|okm|ursk|upsk|udsk|sts|salt|shared).*

  - id: openaliro-crypto-status-discarded
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Return status of a crypto call is discarded. PSA and mbedTLS signal failure only through the
      return value; a discarded status means a failed verify, a failed key import, or a failed
      encrypt is treated as success. Note PSA_SUCCESS is 0, so a truthiness test is also suspect.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**"]
    patterns:
      - pattern-either:
          - pattern: psa_$F(...);
          - pattern: mbedtls_$F(...);
      - pattern-not: $R = psa_$F(...);
      - pattern-not: $R = mbedtls_$F(...);
      - pattern-not: return psa_$F(...);
      - pattern-not: return mbedtls_$F(...);
      - pattern-not: mbedtls_platform_zeroize(...);
      - pattern-not: mbedtls_$F_init(...);
      - pattern-not: mbedtls_$F_free(...);
      - pattern-not: psa_$F_abort(...);

  - id: openaliro-all-zero-iv-or-key
    languages: [c, cpp]
    severity: WARNING
    message: >-
      All-zero IV, nonce, or key constant. Safe only if the associated key is used exactly once.
      Known instances: aliro_crypto.c zero_iv, aliro_ranging.c k_probe_ursk. Prove single use or
      file a finding.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**"]
    patterns:
      - pattern: $T $NAME[$N] = {0};
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(iv|nonce|key|ursk|salt).*

  # ---------------------------------------------------------------- C: parser safety

  - id: openaliro-unsafe-string-function
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Unbounded string function in firmware that parses attacker-controlled input.
    paths:
      # Test trees excluded, unlike the malicious-pattern rules which deliberately still cover
      # them. The difference is what each rule is for: this one asks "could a wire message
      # overflow this", and a test harness formatting a fixture into a buffer it just sized
      # itself has no wire input and no attacker. Three such helpers exist
      # (ports/esp32/test/test_aliro_{apdu,crypto,stepup}.c, all `sprintf(d + 2*i, "%02x", …)`),
      # and blocking merges on them would only teach people to bypass the gate.
      exclude: ["deps/**", "workspace/**", "tests/**", "**/test/**", "**/tests/**"]
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: gets(...)
      - pattern: vsprintf(...)

  - id: openaliro-variable-length-array-from-input
    languages: [c, cpp]
    severity: WARNING
    message: >-
      alloca or a variable-length array sized at runtime. On a Zephyr thread with a fixed stack
      this is a stack overflow if the length comes off the wire. Use a fixed bound.
    paths:
      exclude: ["tests/**", "deps/**", "workspace/**"]
    pattern-either:
      - pattern: alloca(...)
      - pattern: __builtin_alloca(...)

  - id: openaliro-assert-used-as-validation
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Assertion applied to a length, offset, or index in parser or protocol code. If CONFIG_ASSERT
      is disabled in the shipping build, this bounds check does not exist in the released firmware.
      Validate with an explicit check and an error return instead.
    paths:
      include:
        - "modules/woz_aliro/src/*parse*"
        - "modules/woz_aliro/src/aliro_apdu.c"
        - "modules/woz_aliro/src/aliro_prov.c"
        - "modules/woz_aliro_stack/src/protocol/*"
        - "modules/woz_uwb/src/aliro/*"
        - "modules/woz_uwb/src/ccc/ccc_mac.c"
        - "modules/woz_nfc/src/*"
        - "ports/esp32/components/piv_ccid/*"
      exclude: ["tests/**"]
    pattern-either:
      - patterns:
          - pattern: __ASSERT($COND, ...)
          - metavariable-regex:
              metavariable: $COND
              regex: (?i).*(len|size|off|idx|index|count|n_|remain|avail).*
      - patterns:
          - pattern: assert($COND)
          - metavariable-regex:
              metavariable: $COND
              regex: (?i).*(len|size|off|idx|index|count|n_|remain|avail).*

  - id: openaliro-memcpy-length-from-wire-field
    languages: [c, cpp]
    severity: WARNING
    message: >-
      memcpy whose length is read from a parsed structure field. Confirm the length was bounded
      against the destination capacity BEFORE this copy, not after. NOISY by design: this is the
      single highest-yield pattern in this codebase, so triage every hit rather than tuning it out.
    paths:
      include:
        - "modules/**"
        - "ports/esp32/components/**"
      exclude: ["tests/**", "deps/**", "workspace/**"]
    patterns:
      - pattern: memcpy($DST, $SRC, $LEN)
      - metavariable-regex:
          metavariable: $LEN
          regex: .*->.*(len|length|size|count).*

  # ---------------------------------------------------------------- Python

  - id: openaliro-python-shell-injection
    languages: [python]
    severity: ERROR
    message: Subprocess with shell=True. Use the array form.
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: openaliro-python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Unsafe deserialization. presence_service.py parses JSON from a Unix socket and the HA
      integration parses device output; neither may reach pickle, marshal, or an unsafe YAML load.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.load($X)
      - patterns:
          - pattern: yaml.load($X, Loader=$L)
          - metavariable-regex:
              metavariable: $L
              regex: .*(FullLoader|UnsafeLoader|Loader)$

  - id: openaliro-python-eval-exec
    languages: [python]
    severity: ERROR
    message: eval or exec on data. No script in tools/ or host/ has a legitimate use for this.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: openaliro-python-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: openaliro-python-insecure-tempfile
    languages: [python]
    severity: WARNING
    message: >-
      Predictable temp file name. presence_verify.py writes temp files before shelling out to
      openssl; a predictable name is a local symlink attack.
    pattern-either:
      - pattern: tempfile.mktemp(...)
      - pattern: os.tmpnam(...)

  # ---------------------------------------------------------------- Web

  - id: openaliro-remote-script-without-sri
    languages: [generic]
    severity: ERROR
    message: >-
      Remote script loaded without a subresource integrity attribute. web-flasher/index.html loads
      esp-web-tools from unpkg at a floating major version, and that script flashes firmware to the
      lock over WebSerial. Vendor it, pin the exact version, add integrity, and add a CSP.
    paths:
      include: ["*.html"]
      exclude: ["workspace/**", "site/**", "docs/architecture/**"]
    patterns:
      - pattern-regex: '<script[^>]*src=["\x27]https?://[^"\x27]*["\x27][^>]*>'
      - pattern-not-regex: '<script[^>]*integrity=[^>]*>'

  - id: openaliro-third-party-css-import
    languages: [generic]
    severity: WARNING
    message: >-
      Third-party stylesheet or font import. Leaks visitor IP and user agent to the provider and
      adds a subresource that is not integrity checked. Self-host the font.
    paths:
      include: ["*.html", "*.css"]
      exclude: ["workspace/**", "site/**", "docs/_doxygen/**"]
    pattern-regex: '@import\s+(url\()?["\x27]?https?://'

  - id: openaliro-dom-xss-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      DOM sink that executes markup. The twin renders simulated device output and the TUI renders
      real device serial output; neither may reach a sink that interprets it.
    paths:
      exclude: ["workspace/**", "site/**", "node_modules/**"]
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: document.write(...)
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: $EL.insertAdjacentHTML(...)
