# Cloudflare Worker: the openaliro Discord bot.
#
# One Worker serves both halves — firmware triage and hardware compatibility
# tracking. They were built as two deployments (`openaliro-bot` and
# `openaliro-compat-bot`, one D1 each) and unified into this one, so there is a
# single interactions endpoint, a single command list, and a single `rigs`
# table that `/ihave`, `/who-has`, `/matrix` and `/help-me` all read.
#
# No secret lives here. Every binding the Worker reads is set with
# `wrangler secret put NAME`, listed in README.md. This file is committed; the
# values are not.

name = "openaliro-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# No telemetry. Wrangler reports usage on every invocation unless told not to,
# and a build tool has no business narrating a local machine to a third party.
send_metrics = false

# This Worker answers on a custom domain, not on `workers.dev`.
#
# `workers_dev` defaults to TRUE, and turning the URL off in the dashboard does
# not survive: the next `wrangler deploy` reads this file and switches it back
# on. Setting it false here is the only thing that holds. A route has to take
# its place in the same edit, or the Worker deploys with no address at all.
#
# The hostname is public either way — it goes into Discord's developer portal,
# and the Linked Roles flow puts it in a contributor's address bar — so pick one
# that reads as the project rather than as whoever runs it.
workers_dev = false
routes = [{ pattern = "bot.asxeem.com", custom_domain = true }]

# Correlation IDs are only useful if the log they name can be read back.
[observability]
enabled = true

# The hardware registry, plus interaction idempotency and the /build cooldown.
#
# `database_id` is committed on purpose. It is an identifier, not a credential:
# it names a database but grants nothing, since reaching one needs
# account-scoped Cloudflare credentials or this Worker's own binding. It is also
# a random UUID that nobody outside the account can enumerate or resolve, so
# unlike DISCORD_PUBLIC_KEY it cannot be used to correlate this repository with
# a running deployment. The alternative — a gitignored second config — would
# duplicate every binding here to hide something that discloses nothing.
#
# Running your own copy means `wrangler d1 create openaliro-bot` and replacing
# the value below with the one it prints.
#
# Every registry command degrades rather than crashes when this binding is
# absent, which is what makes `npm test` and a fresh clone work with it unset.
[[d1_databases]]
binding = "DB"
database_name = "openaliro-bot"
database_id = "492df9d4-51bb-4e83-bad3-3dc4bdb61e0f"
migrations_dir = "migrations"

# The /test-request escalation sweep: a request sitting with zero accepts past
# its window pings the candidates who were asleep when it was posted. Nothing
# else in this Worker is time-driven.
[triggers]
crons = ["*/5 * * * *"]
