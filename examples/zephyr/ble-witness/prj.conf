# BLE RSSI witness — passive scanner, UART summaries, no unlock authority.

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_DEVICE_NAME="woz-witness"

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# No networking / Matter on the witness in v1: USB/UART to the Pi for captures;
# Matter control arrives later as a bounded vendor cluster on a Thread-capable
# board. Keeping BLE-only here fits nRF52840 dongles and DK boards.
CONFIG_NETWORKING=n
CONFIG_SETTINGS=n
