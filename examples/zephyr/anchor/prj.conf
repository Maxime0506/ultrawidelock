# Anchor-to-anchor DS-TWR bench app.

# ── the UWB tier ─────────────────────────────────────────────────────────────
# ULTRAWIDELOCK_UWB and nothing above it. At this tier uwb_seam.h inlines its four helpers
# straight to the decadriver, uwb_min.c is the only ultrawidelock_uwb source compiled, and
# there is no CCC engine, no key schedule and no credential in the image. The
# responder and credential tiers exist to serve a phone; both ends of this link are
# ours, so neither is wanted here.
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_DW3000=y
CONFIG_DW3000_CHIP_DW3000=y
CONFIG_ULTRAWIDELOCK_UWB=y

# The `ultrawidelock` command tree drives a CCC engine this image does not contain, so
# it would offer commands that cannot work. Same reasoning the CDK reader gives
# (modules/ultrawidelock_uwb/Kconfig:26-29), reached from the other direction.
CONFIG_ULTRAWIDELOCK_UWB_SHELL=n

# ── logging ──────────────────────────────────────────────────────────────────
# RTT, because the DWM3001CDK has no UART console at all and one console
# configuration across both boards is what makes the two capture sessions
# comparable. The nRF5340 DK also has VCOM1, which stage C1 uses; leaving RTT on
# for both means the log FORMAT is identical either way.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# The ring is NOINIT and survives a reset, so without this a fresh image reads
# back the PREVIOUS firmware's log and every conclusion drawn from it is wrong.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# ── the ranging thread ───────────────────────────────────────────────────────
# main() runs the whole exchange, so its stack carries the SPI transfers and the
# 64-bit timestamp arithmetic.
#
# 4096, matching apps/dwm3001cdk-lock/prj.conf, and that is evidence rather than caution.
# This started at 2048 -- the Zephyr default -- with a comment saying to raise it
# only on THREAD_ANALYZER evidence. The evidence arrived as a bring-up that
# printed the DW3000 SPI banner and then stopped dead, with no fault, no further
# log line and a live RTT ring: exactly the shape the three MPU stack-guard
# faults in this repo took. The first SPI transceive is the deepest call the
# init path makes.
CONFIG_MAIN_STACK_SIZE=4096
# So the next one is a message and not another silent hang.
#
# AUTO is off: its 30 s dump is what proved main was being ABORTED rather than
# blocked (main simply stopped appearing in the list), and having done that it
# became a flood that buried the fault dump it had pointed at. Available on
# demand, not spraying.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_NAME=y

# Bring-up only. Deferred logging hands a message to a lower-priority thread,
# so a thread that faults can die with its last words still queued -- which is
# how a crash reads as a hang. Immediate mode writes from the calling context,
# so the line before the fault is guaranteed out. Costs latency on the ranging
# path and must come off before any timing measurement is believed.
CONFIG_LOG_MODE_IMMEDIATE=y

# DROP, NOT BLOCK, AND THIS IS NOT A PREFERENCE. The default for this backend is
# CONFIG_LOG_BACKEND_RTT_MODE_BLOCK, which retries the write until it succeeds.
# With no host draining RTT the 4096 B up-buffer fills and the next LOG_INF never
# returns, so the board silently stops ranging until a monitor attaches -- the
# ranging thread is parked inside a log call. It was survivable while the only
# output was one line per 20 s, which fills the buffer in roughly 14 minutes. A
# line per range fills it in roughly 21 seconds, which makes attended operation
# mandatory rather than convenient.
#
# What DROP costs: lines vanish when nobody is listening. That is the correct
# trade for a bench app, because the lines only matter while a capture is
# running, and a capture by definition has a host attached.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

# No BLE, no Thread, no settings, no USB. A bench link needs none of them, and
# leaving them out is what keeps this image's timing free of anything that could
# preempt the delayed-TX arm.
CONFIG_BT=n
CONFIG_NETWORKING=n
