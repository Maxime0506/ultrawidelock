# Net-core (ipc_radio) controller config for the initiator.
#
# The file form merges after the stock ipc_radio overlays; the directory form
# would REPLACE prj.conf, which is not what is wanted here.
#
# The controller enforces the roles it was built for, so the app core asking to
# scan and connect is not enough on its own: without these two the link layer has
# no initiator or scanner state machine and bt_le_scan_start fails at runtime
# rather than at build time.
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y

# Nothing on this board advertises. The reader is the peer.
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_BROADCASTER=n
