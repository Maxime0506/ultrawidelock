[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openaliro-home-assistant"
version = "0.0.0"
description = "HA=1-gated OpenAliro Home Assistant staging agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2,<3"]

[project.scripts]
openaliro-ha = "openaliro_ha.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
