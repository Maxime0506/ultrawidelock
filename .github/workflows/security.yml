# The blocking security lane: four gates that decide whether a pull request may merge.
#
# Budget is the design constraint. Measured on an 8-core host, the four gates cost about 16s of
# work between them, and they run as four parallel jobs so the wall time is the slowest one
# (semgrep, ~22s with the registry packs) plus runner setup. A reviewer waits well under two
# minutes, and a whole pull request costs ~4 runner-minutes. Anything slower than that lives in
# security-deep.yml instead, which runs weekly and blocks nothing: CodeQL, the full-history
# secret scan, the SBOM, Scorecard.
#
# Every gate here shells out to scripts/security.sh, which is also what `make security` and the
# four security rows in scripts/verify.sh run. One implementation, so "it passed locally" and
# "it will pass CI" keep meaning the same thing — the promise scripts/verify.sh is built on.
#
# Why these four and not a longer list: they are the gaps internal/security-audit/README.md
# ranked highest, in order — no SCA outside GitHub Actions, no secret scanning at all, no
# semgrep, and nothing looking at the shape of a diff. clang-tidy, CBMC, libFuzzer, ASan/UBSan,
# actionlint and zizmor already have their own workflows; none of them is duplicated here.
name: security

on:
  push:
    branches: [main]
  # No path filter. A security gate that skips because a pull request "only touched docs" is a
  # gate with a documented bypass, and the whole lane costs less than the docs job it would be
  # skipping alongside.
  pull_request:
  workflow_dispatch:

# CI only reads the repo. No job here needs a write scope: findings fail the job directly rather
# than being posted anywhere, which is also what makes the lane work unchanged on fork pull
# requests, where the token is read-only and SARIF upload is not available.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by version AND checksum, the same shape workflow-lint.yml uses for actionlint. These
  # tools decide whether code merges, so fetching whatever the latest release happens to be would
  # put an unreviewed binary in that position. Dependabot does not watch release tarballs, so
  # these are bumped by hand.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_VERSION: 2.4.0
  OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
  SEMGREP_VERSION: 1.172.0
  PIP_AUDIT_VERSION: 2.10.1
  RETIRE_VERSION: 5.2.7

jobs:
  # ---------------------------------------------------------------- secrets
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, because the gate scans a commit RANGE on a pull request. A
          # shallow clone has no merge base, so the range would silently collapse to the tip
          # commit and the other commits in the branch would never be scanned.
          fetch-depth: 0
      - name: install pinned gitleaks
        run: |
          curl -fsSLo /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: scan
        env:
          # On a pull request the range is base..head, so only what this branch proposes is
          # scanned. On a push to main there is no range and the working tree is scanned. Neither
          # is the full-history scan; that is security-deep.yml's job.
          SECURITY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          SECURITY_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
        run: scripts/security.sh secrets

  # ---------------------------------------------------------------- mal-diff
  mal-diff:
    name: mal-diff
    runs-on: ubuntu-latest
    # Nothing to compare a push to main against — its base is already merged. The structural
    # review is a property of a proposed change, so it runs on pull requests only.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: structural change review
        env:
          SECURITY_BASE: ${{ github.event.pull_request.base.sha }}
          SECURITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/security.sh mal-diff

  # ---------------------------------------------------------------- semgrep
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pinned semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: scan
        # Whole tree, not the diff. Diff-scoping would be faster, but at 22s the saving is not
        # worth the hole it opens: a rule added today would never be applied to code written
        # yesterday, so the gate would only ever see new code.
        run: scripts/security.sh semgrep

  # ---------------------------------------------------------------- deps
  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pinned scanners
        run: |
          curl -fsSLo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: scan
        # osv-scanner answers both halves of this gate: OSV carries the OpenSSF Malicious
        # Packages feed as MAL- advisories, so a dependency that is hostile rather than merely
        # vulnerable fails here too.
        run: scripts/security.sh deps

  # ---------------------------------------------------------------- web
  # The browser's view of this repo, which no other gate has. `deps` reads lockfiles; the
  # flasher's CDN dependency appears in none of them, and it is the page that drives
  # navigator.serial to write firmware to a board.
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: install pinned retire.js
        # --ignore-scripts is the important flag, not the pin. npm runs preinstall/postinstall
        # hooks from every package in the resolved tree by default, so installing a scanner is
        # itself an arbitrary-code-execution step on the runner — the same npm entry point
        # security/semgrep-malicious.yml blocks inside this repo's own package.json. Refusing to
        # run them here makes the two consistent.
        #
        # zizmor still flags this as an ad-hoc install, and it is right: the pin fixes retire's
        # own version but its transitive tree resolves at install time, because npm has no
        # lockfile for a global install. Accepted rather than silenced blindly — the exposure is
        # a scanner on a throwaway runner with a read-only token, and no hooks execute.
        # zizmor: ignore[adhoc-packages]
        run: npm i -g --ignore-scripts "retire@${RETIRE_VERSION}"
      - name: audit the browser-facing surfaces
        run: scripts/security.sh web

  # ---------------------------------------------------------------- ct
  # Secret-dependent control flow. No test, sanitizer or fuzzer in this repo can see a timing
  # leak — they all check what a function returns, and this checks how long it took to decide.
  # The URSK is poisoned with valgrind's client request API, so a branch on undefined data IS a
  # branch on key material. This is the only gate that covers the bug class the CCC key ladder
  # is most exposed to.
  ct:
    name: ct (constant-time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install clang + valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q clang valgrind
      - name: secret-dependent control flow
        env:
          CT_CC: clang
        run: scripts/security.sh ct

  # ---------------------------------------------------------------- esp pins
  esp:
    name: esp component pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads tracked idf_component.yml files only, so it needs no ESP-IDF and no bootstrap.
      # The rest of the workspace gate (pins, sbom, vulns) needs a fetched tree and lives in
      # security-deep.yml.
      - name: component registry pins
        run: scripts/security.sh esp

  # ---------------------------------------------------------------- attest
  attest:
    name: attest (workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Static check of release.yml. Provenance that is misconfigured fails only when a tag is
      # pushed, which is the worst moment to discover it; this catches it on the pull request
      # that broke it.
      - name: release.yml still produces provenance
        run: scripts/security.sh attest
