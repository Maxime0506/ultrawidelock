# The Home Assistant productization suites. They are gated behind HA=1 so they
# stay out of `make test`, which means nothing runs them implicitly: without
# this workflow the agent, the parser, and the setup script have no gate at all.
#
# Two legs. The first needs nothing but python and covers everything that does
# not import Home Assistant. The second installs Home Assistant so the custom
# component's own tests execute instead of skipping; it is advisory, because it
# tracks an upstream release this repo does not pin.
name: ha-tests

on:
  push:
    branches: [main]
    paths:
      - integration/homeassistant/**
      - tests/host/test_ha_*.py
      - tests/host/test_mqtt_bridge.py
      - Makefile
      - .github/workflows/ha-tests.yml
  # Docs-only PRs cannot change the result, so skip them; every other PR still
  # runs unfiltered. Safe because neither `agent` nor `component` is a required
  # status check: a path-skipped run cannot strand a PR at "Expected". See
  # cbmc.yml for the full rationale and the list that must stay unfiltered.
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

# Superseded runs on the same ref are wasted work — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suites fake every transport, so pyserial and paho are needed only
      # for the import surface the modules declare.
      - name: install agent dependencies
        run: python3 -m pip install 'paho-mqtt>=2,<3' 'pyserial>=3.5,<4'
      # shellcheck arms test_ha_setup's lint case, which skips without it.
      - name: install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: run the HA=1 suites
        run: make ha-test HA=1
      - name: build the component archive
        run: make ha-package HA=1

  # Advisory: exercises the custom component against a real Home Assistant.
  # Without it those cases skip, and a config-flow break would reach a user
  # before it reached a test.
  component:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: install home assistant
        run: python3 -m pip install homeassistant 'paho-mqtt>=2,<3' 'pyserial>=3.5,<4'
      - name: run the component suite
        run: HA=1 python3 -B tests/host/test_ha_component.py
