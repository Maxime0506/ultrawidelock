# Bounded model-checking of the wire parsers with CBMC: proves memory safety
# (no out-of-bounds access, no bad pointer, no overflowing conversion) for ALL
# inputs up to each harness bound — the exhaustive counterpart to fuzzing, which
# only samples. Slower than the other gates (a couple of minutes), so it stands
# as its own workflow.
name: cbmc

on:
  push:
    branches: [main]
    paths:
      - modules/woz_uwb/**
      - modules/woz_aliro/**
      - tests/host/**
      - Makefile
      - .github/workflows/cbmc.yml
  # Docs-only PRs cannot change the result, so skip them; every other PR still
  # runs unfiltered. Safe because `cbmc` is not a required status check: a
  # path-skipped run cannot strand a PR at "Expected". That hazard is real for
  # host-tests, sanitizers, tooling, patch-drift and workflow-lint, which stay
  # unfiltered on purpose. Promoting this to required means dropping the filter.
  pull_request:
    # "**.md" (not "**/*.md"): the latter needs a slash before the filename, so
    # it misses the root-level READMEs. This is GitHub's documented spelling for
    # every Markdown file in the repository.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

# Superseded runs on the same ref are wasted work — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cbmc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install cbmc
        run: sudo apt-get update -q && sudo apt-get install -y -q cbmc
      - name: prove wire-parser memory safety
        run: make cbmc
