# Gates for the walk-up digital twin web page.
#
#   drift-gate     — the constants still living in page JavaScript (the ESP32
#                    walk-up controller port + world pacing) are cited back to
#                    firmware file:line and re-checked against the C tree.
#   wasm-firmware  — the page's decision logic is modules/woz_uwb itself,
#                    compiled to WASM (web-twin/twin.js). Replay the test_twin.c
#                    scenario in node against both the committed file and a
#                    fresh rebuild (pinned emsdk), so the shipped artifact works
#                    and the sources still compile to a working twin. A byte
#                    difference between the two is only a warning: the emsdk
#                    binaries differ across host OSes, so the reproducible build
#                    is not guaranteed byte-identical on the CI runner.
name: twin-web

on:
  push:
    branches: [main]
    paths:
      - web-twin/**
      # Everything compiled into twin.js or cited by the page: a change here
      # must re-run both gates.
      - modules/woz_uwb/**
      - ports/esp32/apps/matter-lock/**
      - tests/host/**
      - scripts/twin-wasm.sh
      - Makefile
      - .github/workflows/twin-web.yml
  # Docs-only PRs cannot change the result, so skip them; every other PR still
  # runs unfiltered. Safe because neither `drift-gate` nor `wasm-firmware` is a
  # required status check: a path-skipped run cannot strand a PR at "Expected".
  # See cbmc.yml for the full rationale and the list that must stay unfiltered.
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# CI only reads the repo: no token write scopes.
permissions:
  contents: read

# Superseded runs on the same ref are wasted work — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: twin constants match the firmware
        run: make test-web

  wasm-firmware:
    runs-on: ubuntu-latest
    env:
      # The emsdk the local `make twin-wasm` uses; CI rebuilds with the same
      # version so the drift warning is meaningful. Bump both together.
      EMSDK_VERSION: 6.0.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cache emsdk
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: committed twin.js passes the test_twin.c scenario (node)
        run: node web-twin/selftest.cjs
      - name: rebuild the twin firmware (WASM)
        run: make twin-wasm
      - name: rebuilt twin.js passes the test_twin.c scenario (node)
        run: node web-twin/selftest.cjs
      - name: committed twin.js is current (warn-only)
        run: |
          if ! git diff --exit-code --stat -- web-twin/twin.js; then
            echo "::warning::web-twin/twin.js differs from a local rebuild. If you changed a compiled source, run 'make twin-wasm' and commit it. A bytes-only difference is expected across host OSes (the emsdk binaries differ) and is harmless: both artifacts passed the node self-test above."
          fi
