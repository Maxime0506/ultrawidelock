# The non-blocking security lane: the analyses that are too slow to sit in front of a merge.
#
# ci.yml decides whether a pull request may merge and finishes in a couple of minutes.
# Everything here takes minutes to tens of minutes, so it runs weekly and on demand, and
# blocks nothing. Splitting them is the point: a security gate that makes people wait ten minutes
# for a docs typo is a gate that gets marked non-required within a month, and then the fast
# checks that were sharing the workflow stop blocking too.
#
# Findings land in the repository's code-scanning tab rather than failing a job, which is what
# `security-events: write` below is for. That is available because this repository is public;
# on a private repository without Advanced Security the SARIF uploads would need removing and
# the jobs would have to fail directly instead.
#
# Deliberately NOT here, so the omissions are decisions rather than oversights:
#
#   CodeQL           GitHub's default setup runs it, configured in the repository settings rather
#                    than in this file, and the two cannot coexist — an advanced configuration
#                    uploading SARIF while default setup is enabled is rejected outright with
#                    "CodeQL analyses from advanced configurations cannot be processed", which is
#                    how this job spent its first run failing. Default setup wins the trade here:
#                    GitHub maintains the query packs and the CLI version, and it picks up a new
#                    language without anyone editing a matrix. What a workflow buys is control of
#                    the build for compiled languages, and that is worth least in this repository
#                    — the C is already under clang-tidy, CBMC, ASan/UBSan, libFuzzer and semgrep
#                    p/c, and the database this job built came from `make test`, so it only ever
#                    saw the host-compilable subset rather than the firmware.
#
#   syft / an SBOM   internal/security-audit/TOOLING.md makes the case against it plainly: syft
#                    over this source tree finds bun.lock and pyproject.toml and almost nothing
#                    else, because NCS, Zephyr, ESP-IDF, esp-matter and the ESP component
#                    registry are none of them in the tree at scan time. That is most of the
#                    shipped binary. Publishing an SBOM that omits the RTOS and the TLS stack is
#                    worse than publishing none, because it looks like an answer. A real one
#                    means scanning workspace/ after `make bootstrap` and merging the ESP managed
#                    components, which is its own piece of work.
#   trivy / grype    a second opinion on the same lockfiles osv-scanner already reads in the fast
#                    lane. Checked by hand while building this: both agree with osv-scanner on
#                    this repository, finding the identical two advisories and nothing more.
#   ZAP / DAST       there is no web application to point it at. The honest dynamic testing here
#                    is the existing fuzz and sanitizer gates, and RF work on a bench.
name: security-deep

on:
  schedule:
    # 04:17 on Mondays. Off the hour on purpose: scheduled workflows across GitHub bunch up at
    # :00 and get queued, and nothing here is time-critical.
    - cron: "17 4 * * 1"
  # Deliberately no `push` trigger. This lane blocks nothing, so running it on
  # every merge to main bought no signal a Monday run does not, while re-scanning
  # all of history per push with cancel-in-progress off. Use workflow_dispatch to
  # get an answer before Monday.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.172.0

jobs:
  # ---------------------------------------------------------------- full-history secrets
  secrets-history:
    name: secrets (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install pinned gitleaks
        run: |
          curl -fsSLo /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      # Every commit ever made, which the fast lane deliberately does not do (~18s over 576
      # commits today, and growing). This is the scan that matters for the risk SECURITY.md
      # names: a flight-recorder log embedding the session URSK is just as exposed if it was
      # committed once and reverted, because history keeps it.
      - name: scan all history
        run: |
          gitleaks detect --source . --log-opts=--all --redact --config security/gitleaks.toml
      # A file type that should never have been committed is invisible to a content regex once
      # it is compressed or binary, so it is checked by name across all of history too.
      - name: no capture or flight-recorder file has ever been committed
        # Seven fixtures legitimately carry these extensions, so the check is against
        # security/capture-baseline.txt rather than against zero. Reviewed there, not here:
        # adding a path is meant to be a decision someone writes a reason for.
        run: |
          hits="$(git log --all --diff-filter=A --name-only --format= \
            | grep -Ei '\.(log|frc|pcap|pcapng|pklg|btsnoop)$' | sort -u || true)"
          known="$(grep -vE '^\s*(#|$)' security/capture-baseline.txt | sort -u)"
          new="$(comm -23 <(printf '%s\n' "$hits" | grep -v '^$' | sort -u) \
                         <(printf '%s\n' "$known"))"
          if [ -n "$new" ]; then
            echo "::error::files that carry the session URSK or personal Bluetooth data exist in history:"
            printf '%s\n' "$new"
            echo "If one of these is a reviewed fixture, add it to security/capture-baseline.txt"
            echo "with a reason. If it came off the bench, it does not belong in the repository —"
            echo "and deleting it now does not help, because history keeps it."
            exit 1
          fi
          # A baseline entry that stops matching is debt outliving its problem, so it fails too.
          stale="$(comm -13 <(printf '%s\n' "$hits" | grep -v '^$' | sort -u) \
                            <(printf '%s\n' "$known"))"
          if [ -n "$stale" ]; then
            echo "::error::security/capture-baseline.txt lists paths that were never committed:"
            printf '%s\n' "$stale"
            exit 1
          fi
          printf 'no unreviewed capture file in history (%s baselined)\n' \
            "$(printf '%s\n' "$known" | wc -l | tr -d ' ')"

  # ---------------------------------------------------------------- semgrep, full report
  semgrep-sarif:
    name: semgrep (full report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pinned semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"
      # Every severity, not just the blocking ones. The fast lane fails only on ERROR, so the
      # WARNING findings — the NOISY-by-design rules that are most of this ruleset's value over
      # time — would otherwise never be visible anywhere. Here they become code-scanning alerts
      # that can be triaged once and dismissed, instead of scrolling past in a log.
      - name: scan
        run: |
          semgrep scan --metrics=off --sarif --output semgrep.sarif \
            --config security/semgrep-openaliro.yml \
            --config security/semgrep-malicious.yml \
            --config p/c --config p/secrets --config p/python \
            --config p/typescript --config p/javascript --config p/github-actions \
            --exclude workspace --exclude build --exclude site --exclude .venv \
            --exclude node_modules --exclude deps/dw3000 --exclude docs/architecture \
            --exclude 'tests/host/fuzz/corpus' . || true
      - name: upload
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------- supply-chain posture
  scorecard:
    name: openssf scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard reads branch-protection and workflow-permission settings that only exist for the
    # default branch, so it has nothing to say about a branch or a fork. Gated on the ref alone
    # since the push trigger went away: a workflow_dispatch from a branch must still skip.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      # Scorecard signs its results so a consumer can verify they came from this repository's
      # own workflow rather than being handed over by someone claiming to be it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: upload
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
