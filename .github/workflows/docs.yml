# The documentation site: rendered and published from main.
#
#   build    — renders the site exactly as `make docs` does locally. The page
#              generator's freshness check fails when docs/ has fallen behind
#              the sources, and the link pass fails on a dead link.
#   publish  — deploys the rendered site to GitHub Pages, so the published site
#              refreshes itself on every merge, and after a release. The job that
#              deploys holds no write access to the repository.
#
# "After a release" is the one non-obvious trigger: the flash page is assembled
# at build time from the latest release's assets, so it goes stale the moment a
# release publishes and stays stale until the site is rebuilt. See the
# workflow_run block below.
#
# Pull requests do not run this. The same freshness and link checks run as the
# `docs` gate inside ci.yml's sweep, on every pull request, without needing the
# Pages environment or the generator secret — which a fork PR never gets anyway.
name: docs

# workflow_run is flagged as fundamentally insecure, and usually it is: the
# classic hole is a workflow that a fork pull request can start, producing an
# artifact that a workflow_run job then consumes while holding write scope.
# Neither half of that shape exists here, which is why this is accepted rather
# than silenced blindly:
#
#   - the only workflow named below is release.yml, which is workflow_dispatch
#     only and guarded to vN.N.N tags, so nothing a fork or an outside
#     contributor can do will start it. It takes repository write access.
#   - this workflow consumes nothing from the triggering run. No artifact
#     download, no ref from the event: the build job checks out the default
#     branch and renders from that, exactly as a push to main does.
#
# The alternative designs are worse. Having release.yml call the API to start
# this workflow needs actions:write on a workflow that currently holds one
# narrowly-scoped contents:write, and repository_dispatch needs a PAT.
on: # zizmor: ignore[dangerous-triggers]
  # Push to main, after a release, and manual. Not pull requests: the `docs` gate
  # that catches drift before a merge runs inside ci.yml's sweep, so a PR needs
  # nothing from here.
  push:
    branches: [main]
  # A release publishes new firmware assets, and tools/docs_flash.py builds the
  # flash page by fetching releases/latest/download at build time. Without this
  # the page keeps advertising the previous firmware until someone next pushes to
  # main, which after a manual release may be a while. release.yml cannot publish
  # the page itself (it holds no pages:write, and should not), so the link is a
  # workflow_run instead.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

# Elevated to write on the publishing job only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # `completed` fires on failure and cancellation too, and a release that did
    # not finish published no assets worth rebuilding for.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: main, for the drift gate
        # The generator compares prose against the sources on main, and docs.sh
        # refuses to regenerate from a checkout behind it. Neither ref exists
        # after a pull-request checkout, which fetches only the merge ref.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: page generator
        # The tool is named by a repository secret, not by this tree. Absent
        # (fork pull requests), docs.sh says so and builds what it can.
        env:
          SPEC: ${{ secrets.DOCS_GEN_SPEC }}
        run: |
          if [ -z "$SPEC" ]; then
            echo "::notice::no page generator configured for this run — building the reference tree only"
            exit 0
          fi
          pipx install "$SPEC"
          cmd="${SPEC%%[!A-Za-z0-9_-]*}"
          cat >tools/docs_generate.local <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          case "\${1:-}" in
          build) exec $cmd --html ;;
          check) exec $cmd --check ;;
          *) exit 2 ;;
          esac
          EOF
          chmod +x tools/docs_generate.local
      - name: render the site
        run: make docs
      - name: pack the site
        # The artifact is what Pages serves, so the deploying job below needs
        # no checkout, no generator and no page pass of its own.
        #
        # workflow_run is named explicitly rather than trusted to set github.ref
        # to the default branch: release.yml runs from a tag, and the point of
        # that run is to republish, so it must not depend on how GitHub happens
        # to populate the ref for a cross-workflow trigger.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: build
    # main only, whether it got here by a merge, by hand, or by a release
    # finishing. The environment gates the branch a second time, on GitHub's
    # side. See the pack step above for why workflow_run is named explicitly.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploying needs no write access to the repository at all: pages:write
    # publishes the artifact, id-token:write proves to Pages which workflow
    # built it. Nothing here can touch a branch or a tag.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time, and never cancel one midway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
