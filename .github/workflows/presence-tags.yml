# Verifies the presence assertion on a release tag: that a provisioned
# credential was physically within a few tens of centimetres of the machine when
# the tag was made, measured by UWB time-of-flight. Complements tag signing
# rather than replacing it — a GPG signature says who, this says physically
# there, and only the second survives a stolen key.
#
# Adoption ramp, deliberately: a tag carrying no assertion passes with a note.
# Only a tag that claims presence and fails to prove it fails the job. Pass
# --require to tools/presence_git.py to make an assertion mandatory once every
# release is signed this way.
#
# Trusted dongles come from .presence/enrolled in the repo, never from the tag,
# so adding one is a reviewable change like any other.
name: presence-tags

# Both patterns on purpose. presence/* is where tools/presence_git.py now puts
# assertions, kept out of the vN.N.N release namespace so the two can never
# collide. v* stays listed because a release tag that grows an assertion later
# must still be checked, and because the adoption ramp below means an ordinary
# release tag carrying none simply passes with a note.
on:
  push:
    tags: ["v*", "presence/*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to verify
        required: true

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

# Tag verifications are cheap and independent; never cancel one for another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the verifier resolves the tag to its commit, and the
          # annotated tag object carries the assertion in its message.
          fetch-depth: 0
      - name: verify presence assertion
        env:
          # Via the environment, not inline interpolation: a tag name is
          # attacker-influenced text and must never reach the shell as code.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 tools/presence_git.py verify --tag "$TAG"
