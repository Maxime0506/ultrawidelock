# Enforces the repo .clang-format over the project-owned C core (modules/).
# Pinned to the exact clang-format used for the bulk reformat — output differs
# across majors, so an unpinned check would flap on runner upgrades.
name: format

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - .clang-format
      - .github/workflows/format.yml
  # Docs-only PRs cannot change the result, so skip them; every other PR still
  # runs unfiltered (the old noop-twin workaround double-reported on mixed PRs,
  # so do not reintroduce it). Safe because `clang-format` is not a required
  # status check: a path-skipped run cannot strand a PR at "Expected". See
  # cbmc.yml for the full rationale and the list that must stay unfiltered.
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

# Superseded runs on the same ref are wasted work — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned clang-format
        run: pip install clang-format==22.1.8
      - name: check modules/ formatting
        run: |
          git ls-files 'modules/*.c' 'modules/*.h' 'modules/*.cpp' \
            | xargs clang-format --dry-run --Werror
