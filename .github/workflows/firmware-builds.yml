# Firmware build gates — prove the shipped firmware trees still compile.
# Heavyweight cross-toolchain builds, so none of these jobs is a required
# check: a path-skipped job that never reports is fine here (contrast with the
# required checks, e.g. patch-drift.yml, which must always report on PRs).
#
# Workflow-level `paths:` can only gate the whole file, so per-job filtering
# uses a change-detection job: `changes` computes which build inputs a push/PR
# actually touched and each build job keys off its output.
name: firmware-builds

on:
  push:
    branches: [main]
    paths:
      - ports/esp32/**
      - ports/nrf5340dk/**
      - modules/**
      - deps/dw3000/**
      - west.yml
      - scripts/bootstrap.sh
      - scripts/build.sh
      - .github/workflows/firmware-builds.yml
      # Last so it wins: markdown never compiles into firmware, so pure-docs
      # pushes (READMEs live inside the build dirs) skip the workflow.
      - "!**/*.md"
  pull_request:
    paths:
      - ports/esp32/**
      # The Matter app builds only on push/nightly/dispatch (see esp32-matter
      # below), so PRs touching nothing but its app dir skip the workflow.
      - "!ports/esp32/apps/matter-lock/**"
      - ports/nrf5340dk/**
      - modules/**
      - deps/dw3000/**
      - west.yml
      - scripts/bootstrap.sh
      - scripts/build.sh
      - .github/workflows/firmware-builds.yml
      # Last so it wins, mirroring the push filter above: markdown never
      # compiles into firmware, and READMEs live inside the build dirs.
      - "!**/*.md"
  workflow_dispatch:
  # Nightly canary for the Matter build: its setup reaches live upstreams
  # (esp-matter submodules, CHIP CIPD packages), so breakage can appear with
  # no push here. 03:27 UTC.
  schedule:
    - cron: "27 3 * * *"

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

# Superseded runs on the same ref are wasted work — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which build inputs did this push/PR touch? Feeds the per-job gates below.
  # On workflow_dispatch and schedule the filter is skipped and every gate's
  # event condition takes over (a manual run builds everything; the nightly
  # builds the Matter app).
  changes:
    runs-on: ubuntu-latest
    outputs:
      esp32-idf: ${{ steps.filter.outputs.esp32-idf }}
      esp32-initiator: ${{ steps.filter.outputs.esp32-initiator }}
      nrf5340dk: ${{ steps.filter.outputs.nrf5340dk }}
      esp32-matter: ${{ steps.filter.outputs.esp32-matter }}
      aliro-blob: ${{ steps.filter.outputs.aliro-blob }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # Push events diff against the pre-push commit, which a depth-1
          # clone does not have.
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          # The esp32 component/module dirs are shared by both ESP32 apps;
          # per-app dirs are added on top (see the app CMakeLists for the
          # REPO_ROOT source references the components compile).
          #
          # The !(*.md) suffix keeps READMEs from counting as build inputs.
          # It must sit inside each glob: a filter ORs its patterns, so a
          # separate `!**/*.md` rule would match every non-markdown file in
          # the repo, and the `predicate-quantifier: every` mode that does
          # support bare exclusions breaks multi-directory filters like these
          # (no file can be in two directories at once).
          filters: |
            esp32-shared: &esp32-shared
              - ports/esp32/components/**/!(*.md)
              - modules/woz_aliro/**/!(*.md)
              - modules/woz_port/**/!(*.md)
              - modules/woz_uwb/**/!(*.md)
              - deps/dw3000/**/!(*.md)
              - .github/workflows/firmware-builds.yml
            esp32-idf:
              - *esp32-shared
              - ports/esp32/apps/reader/**/!(*.md)
            esp32-initiator:
              - *esp32-shared
              - ports/esp32/apps/initiator/**/!(*.md)
            esp32-matter:
              - *esp32-shared
              - ports/esp32/apps/matter-lock/**/!(*.md)
            nrf5340dk:
              - west.yml
              - scripts/bootstrap.sh
              - scripts/build.sh
              - ports/nrf5340dk/**/!(*.md)
              - modules/woz_aliro_stack/**/!(*.md)
              - modules/woz_nfc/**/!(*.md)
              - modules/woz_uwb/**/!(*.md)
              - modules/woz_aliro_ecp/**/!(*.md)
              - modules/woz_port/**/!(*.md)
              - deps/dw3000/**/!(*.md)
              - .github/workflows/firmware-builds.yml
            # Compatibility build for the explicit ALIRO_SOURCE=0 fallback.
            # Source-stack-only edits cannot affect it; shared nRF inputs can.
            aliro-blob:
              - ports/nrf5340dk/**/!(*.md)
              - modules/woz_nfc/**/!(*.md)
              - modules/woz_uwb/**/!(*.md)
              - modules/woz_aliro_ecp/**/!(*.md)
              - modules/woz_port/**/!(*.md)
              - deps/dw3000/**/!(*.md)
              - west.yml
              - scripts/bootstrap.sh
              - scripts/build.sh
              - .github/workflows/firmware-builds.yml

  # Plain ESP-IDF reader app. All dependencies are in-tree, so this is the
  # cheapest firmware build: the official IDF container plus idf.py.
  esp32-idf:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.esp32-idf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compiler cache: the run-unique key means the post-job save always
      # uploads a fresh cache, and restore-keys picks the newest previous one
      # (stale entries fall out via LRU eviction). Unlike the workspace/tree
      # caches below, a stale ccache is harmless — worst case is a slower
      # build, never a wrong one.
      - name: restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-idf-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-idf-
      - name: build the reader app (esp32s3)
        working-directory: ports/esp32/apps/reader
        # Steps bypass the image entrypoint, so source the IDF env explicitly.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          # CONFIG_WOZ_PRESENCE is default n and no sdkconfig.defaults sets it,
          # so the build above compiles none of the non-door primitive. Build it
          # explicitly, in its own directory, or it rots unnoticed the way
          # CONFIG_WOZ_PIV_CCID did: broken build config, green CI, caught only
          # when someone finally tried it on a bench.
          idf.py -B build-presence \
                 -DSDKCONFIG=build-presence/sdkconfig \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.presence" \
                 build
          # Linking is not enough -- --gc-sections has eliminated these before.
          # Both names are absent from a defaults-only build; aliro_ec_p256_keygen
          # is not, because the Aliro credential path links it either way.
          xtensa-esp32s3-elf-nm build-presence/woz_uwb_esp32s3.elf \
            | grep -qE ' T presence_link_init$'
          xtensa-esp32s3-elf-nm build-presence/woz_uwb_esp32s3.elf \
            | grep -qE ' T aliro_assert_build_p256$'
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"

  # Aliro initiator (User-Device role) — the bench HIL peer for our reader.
  # It links the same modules/woz_aliro core as the reader app but through the
  # opposite-direction device sources, so a reader-side codec change compiles
  # here or not at all. Without this job the app rots exactly the way the reader
  # job's presence build guards against: the two roles must stay codec-synced,
  # and nothing else in CI ever compiles the device half.
  esp32-initiator:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.esp32-initiator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-initiator-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-initiator-
      - name: build the initiator app (esp32s3)
        working-directory: ports/esp32/apps/initiator
        # Steps bypass the image entrypoint, so source the IDF env explicitly.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          # Linking is not enough -- --gc-sections has eliminated reachable-looking
          # code before. These four are the device half's entry points: the state
          # machine, its init, the BleSK ranging-channel mirror, and the advert
          # decoder. If any is gone the app builds but cannot talk to a reader.
          for sym in aliro_device_on_command aliro_device_init \
                     aliro_dev_blesk_init aliro_ble_central_parse_adv; do
            xtensa-esp32s3-elf-nm build/aliro_initiator_esp32s3.elf \
              | grep -qE " T $sym\$" || { echo "missing symbol: $sym" >&2; exit 1; }
          done
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"

  # Default nRF5340 DK Zephyr/NCS build, including the in-tree Aliro source
  # stack: bootstrap the pinned west workspace (multi-GB fetch), then the
  # sysbuild image. The bootstrapped workspace is cached,
  # keyed on everything that shapes its content — the pin record (west.yml),
  # the applier (scripts/bootstrap.sh: add-on pin, NCS version and patch list
  # live there) and the patch files — so patch drift forces a cold bootstrap.
  # Deliberately no restore-keys: bootstrap.sh cannot re-patch a workspace
  # that already carries another patch state (patches that add files leave
  # untracked files behind), so a near-miss cache would poison the build.
  nrf5340dk:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.nrf5340dk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      # NCS toolchain container matching west.yml's NCS v3.3.0. Its BASH_ENV
      # hook sources the toolchain env (west, Zephyr SDK on PATH) in every
      # non-interactive bash, so the scripts run with ALIRO_TOOLCHAIN=env: the
      # default nrfutil launcher would look for its toolchain index under
      # $HOME, which the runner overrides away from the image's /opt.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    env:
      ALIRO_TOOLCHAIN: env
      # History-free fetch of exactly the pinned revisions: the same tree
      # state at a fraction of the size, so bootstrap and the workspace cache
      # are both much faster. The bench default keeps full clones.
      ALIRO_SHALLOW: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the bootstrapped west workspace
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
      - name: bootstrap the workspace (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        # One retry: bootstrap is resumable (the fetch sentinel means a rerun
        # picks up where an interrupted west update stopped), so a transient
        # fetch failure costs one resume, not the whole multi-GB fetch.
        run: |
          ./scripts/bootstrap.sh || {
            echo "::warning::bootstrap failed once — retrying (resumes the fetch)"
            ./scripts/bootstrap.sh
          }
      # Save before building: the build writes only to ./build, so the
      # workspace is already complete here, and an expensive bootstrap is not
      # lost when the build step itself fails (the failure this gate exists
      # to catch).
      - name: save the workspace cache (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: ${{ steps.ws.outputs.cache-primary-key }}
      # See the esp32-idf job for the ccache key/restore-keys rationale. The
      # NCS toolchain bundles ccache and Zephyr picks it up from PATH
      # automatically (zephyr/cmake/modules/ccache.cmake), so warm builds
      # skip most compilation.
      - name: restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-${{ github.run_id }}
          restore-keys: |
            ccache-nrf5340dk-
      - name: build (nrf5340dk/nrf5340/cpuapp, sysbuild)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ./scripts/build.sh build
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"

  # Compatibility build for the legacy Nordic Aliro archive. The normal
  # nrf5340dk job above compiles the in-tree source stack; this sibling proves
  # ALIRO_SOURCE=0 remains usable for regression isolation. It shares the
  # bootstrapped workspace cache because the choice is compile-time only, but
  # has a distinct compiler cache. Source-stack-only changes skip this job.
  nrf5340dk-aliro-blob:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.aliro-blob == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    env:
      ALIRO_TOOLCHAIN: env
      ALIRO_SHALLOW: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the bootstrapped west workspace
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
      - name: bootstrap the workspace (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        run: |
          ./scripts/bootstrap.sh || {
            echo "::warning::bootstrap failed once — retrying (resumes the fetch)"
            ./scripts/bootstrap.sh
          }
      - name: save the workspace cache (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: ${{ steps.ws.outputs.cache-primary-key }}
      - name: restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-aliro-blob-${{ github.run_id }}
          restore-keys: |
            ccache-nrf5340dk-aliro-blob-
      - name: build (nrf5340dk/nrf5340/cpuapp, sysbuild, ALIRO_SOURCE=0)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ALIRO_SOURCE=0 ./scripts/build.sh build
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"

  # ESP32-S3 Matter door lock against esp-matter at the bench-validated
  # revision (6+ GB once the CHIP submodule tree is in). Deliberately kept off
  # PRs — push to main, nightly and manual runs only — until the cache proves
  # out. The esp-matter tree (including CHIP's CIPD-fetched gn/zap under
  # .environment) is cached on a static key: its revision is pinned, so only
  # a revision or IDF bump rolls the key.
  esp32-matter:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.esp32-matter == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      # The bench-validated esp-matter revision; the cache key derives from it.
      ESP_MATTER_REV: 93b168027bf95f4e467230345ad1f2d147eb1f6b
      ESP_MATTER_PATH: /opt/esp/esp-matter
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore esp-matter
        id: esp-matter
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/esp-matter
          key: esp-matter-${{ env.ESP_MATTER_REV }}-idf-v5.5.4
      # Python build headers, unconditionally (both cache paths install pip
      # deps into the same container). esp-matter's own requirements.txt and
      # CHIP's setup pin packages whose old versions ship no cp312 wheel, so
      # pip compiles them from source against the container's python 3.12 — and
      # this ubuntu:24.04 image has no Python.h. The version seds below only
      # cover CHIP's files; installing the headers is the root-cause fix that
      # lets any from-source wheel build succeed, here and in future domino
      # pins we do not control.
      - name: install python build headers
        run: apt-get update -q && apt-get install -y -q python3-dev
      - name: fetch + install esp-matter (cold cache)
        if: steps.esp-matter.outputs.cache-hit != 'true'
        # Pinned-SHA clone (git clone --branch takes no SHA, so init + fetch),
        # then the setup esp-matter documents: shallow esp32 submodules and
        # install.sh, minus the chip-tool/chip-cert host tools the firmware
        # build never runs. One from-scratch retry absorbs transient fetch
        # failures. Subshell + && chain on purpose: the cd stays contained,
        # and `set -e` is suppressed inside a `||` context, so an explicit
        # chain is the only reliable early-exit.
        run: |
          . "$IDF_PATH/export.sh"
          setup() (
            rm -rf "$ESP_MATTER_PATH" &&
            git init -q "$ESP_MATTER_PATH" &&
            cd "$ESP_MATTER_PATH" &&
            git remote add origin https://github.com/espressif/esp-matter.git &&
            git fetch -q --depth 1 origin "$ESP_MATTER_REV" &&
            git checkout -q FETCH_HEAD &&
            git submodule update --init --depth 1 &&
            ./connectedhomeip/connectedhomeip/scripts/checkout_submodules.py \
              --platform esp32 linux --shallow &&
            # CHIP pins cffi==1.15.0 for python<3.13, but on Linux the CHIP
            # venv runs the container's python (3.12 on this ubuntu:24.04
            # image) — pigweed's python311.json override only covers darwin
            # and windows — and no cffi 1.15.x ships a cp312 wheel, so pip
            # compiles it from source and dies in this container. 1.17.1 is
            # CHIP's own pin for python>=3.13 and ships cp312 wheels.
            sed -i 's/cffi==1.15.0/cffi==1.17.1/' \
              connectedhomeip/connectedhomeip/scripts/setup/constraints.txt \
              connectedhomeip/connectedhomeip/scripts/setup/requirements.all.txt &&
            # Same story one step later: requirements.esp32.txt pins
            # bitarray==2.6.0, which has no wheel for the container's build
            # python 3.12, so pip compiles it from source and fails on a
            # missing Python.h. 2.8.2 is the first release with a cp312
            # manylinux x86_64 wheel, so pip installs it prebuilt.
            sed -i 's/bitarray==2.6.0/bitarray==2.8.2/' \
              connectedhomeip/connectedhomeip/scripts/setup/requirements.esp32.txt &&
            ./install.sh --no-host-tool
          )
          setup || {
            echo "::warning::esp-matter setup failed once — retrying from scratch"
            setup
          }
      # Save before building, so a broken app build does not throw away the
      # expensive fetch + install.
      - name: save the esp-matter cache (cold cache)
        if: steps.esp-matter.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/esp-matter
          key: ${{ steps.esp-matter.outputs.cache-primary-key }}
      - name: install the esp-matter python deps (warm cache)
        if: steps.esp-matter.outputs.cache-hit == 'true'
        # install.sh put these into the IDF python env, which lives in the
        # container image, not in the cache — reinstate them on cache hits.
        run: |
          . "$IDF_PATH/export.sh"
          python3 -m pip install -q -r "$ESP_MATTER_PATH/requirements.txt"
      # See the esp32-idf job for the ccache key/restore-keys rationale.
      # Covers the IDF-side components; the CHIP core built through GN keeps
      # its own compile times.
      - name: restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-matter-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-matter-
      - name: build the matter-lock app (esp32s3)
        working-directory: ports/esp32/apps/matter-lock
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          # Presence second, not instead: the default build above is the only
          # thing that catches code which compiles ONLY with presence on (an
          # unused declaration outside the guard, say). The presence build is a
          # strict superset of the compiled sources -- every CONFIG_WOZ_PRESENCE
          # site in this app is a bare #ifdef with no #else -- so neither build
          # subsumes the other's failures.
          #
          # Costs a second CHIP tree. Affordable only because this job is
          # already off PRs (push to main, nightly, manual), and because the
          # shared ccache makes the CHIP objects hits rather than rebuilds.
          idf.py -B build-presence \
                 -D SDKCONFIG=build-presence/sdkconfig \
                 -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.presence' \
                 build
          # Linking is not enough -- --gc-sections has eliminated the P-256 code
          # from an image that built cleanly before. presence_link_cmd is the
          # app-facing one: it is what registers the console command, so it is
          # absent exactly when this app's own presence wiring has rotted.
          xtensa-esp32s3-elf-nm build-presence/door_lock.elf \
            | grep -qE ' T presence_link_cmd$'
