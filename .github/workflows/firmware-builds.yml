# Firmware build gates — prove the shipped firmware trees still compile.
#
# Manual only. These are the heaviest thing this repository can ask of CI (the
# NCS and ESP-IDF toolchains, multi-GB workspaces, tens of minutes), and they
# ran on every push until the CI trim. Nothing here is a required check and
# nothing here runs by itself: dispatch it before cutting a release, after an
# upstream bump, or when a change reaches the parts of the tree that the host
# sweep in ci.yml cannot see — Kconfig, devicetree, linker scripts, flash fit.
#
# ci.yml compiles the portable C under modules/ on every push, which catches a
# change that would not build. It cannot catch the four things above, and no
# cheap check can: reaching them means running these toolchains.
#
# A dispatch builds every target. The change-detection job that used to gate
# each build on which paths a push touched went with the push trigger.
name: firmware-builds

on:
  workflow_dispatch:
    inputs:
      targets:
        # ONE TARGET AT A TIME, because a dispatch used to build all six and
        # most reasons to dispatch concern one of them. An upstream NCS bump
        # wants the nRF three; an sdkconfig change wants the ESP three; a
        # linker or partition change on the CDK wants exactly one job and not
        # ninety minutes of ESP-IDF beside it.
        #
        # The `nrf` and `esp32` groups exist because those are the two real
        # blast radii: anything in west.yml or the patches moves all three nRF
        # builds together, and an esp-matter or IDF bump moves all three ESP
        # ones.
        description: "which firmware to build"
        type: choice
        default: all
        options:
          - all
          - nrf
          - esp32
          - dwm3001cdk
          - nrf5340dk
          - nrf5340dk-aliro-blob
          - esp32-idf
          - esp32-initiator
          - esp32-matter
      save_ccache:
        # Every per-job ccache entry below is keyed on github.run_id, so the
        # combined actions/cache action always writes a fresh ~300 MB entry on
        # a normal save — that is the intended behaviour for a maintainer's
        # own dispatch (restore-keys picks up the newest one next time). A
        # bot answering a one-off Discord /build should not pay that cost: it
        # is exactly the eviction pressure that can push nrf-workspace or the
        # esp-matter cache (the two entries actually expensive to rebuild) out
        # of the repository's 10 GB LRU budget. False makes every per-job
        # ccache step restore-only for that run; the nrf-workspace and
        # esp-matter caches are untouched by this flag; they already save only
        # on a genuine cold miss.
        description: "save a fresh ccache entry after this run (false for restore-only)"
        type: boolean
        default: true

# CI only reads the repo: no token write scopes for any job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  esp32-idf:
    if: contains(fromJSON('["all", "esp32", "esp32-idf"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compiler cache: the run-unique key means the post-job save always
      # uploads a fresh cache, and restore-keys picks the newest previous one
      # (stale entries fall out via LRU eviction). Unlike the workspace/tree
      # caches below, a stale ccache is harmless — worst case is a slower
      # build, never a wrong one.
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-idf-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-idf-
      - name: build the reader app (esp32s3)
        working-directory: ports/esp32/apps/reader
        # Steps bypass the image entrypoint, so source the IDF env explicitly.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          # One build root for the whole repo, the same tree `make esp-build` uses.
          B="$GITHUB_WORKSPACE/build"
          idf.py -B "$B/esp32-reader-esp32s3" \
                 -D SDKCONFIG="$B/esp32-reader-esp32s3/sdkconfig" set-target esp32s3
          idf.py -B "$B/esp32-reader-esp32s3" \
                 -D SDKCONFIG="$B/esp32-reader-esp32s3/sdkconfig" build
          # CONFIG_WOZ_PRESENCE is default n and no sdkconfig.defaults sets it,
          # so the build above compiles none of the non-door primitive. Build it
          # explicitly, in its own directory, or it rots unnoticed the way
          # CONFIG_WOZ_PIV_CCID did: broken build config, green CI, caught only
          # when someone finally tried it on a bench.
          idf.py -B "$B/esp32-reader-esp32s3-presence" \
                 -DSDKCONFIG="$B/esp32-reader-esp32s3-presence/sdkconfig" \
                 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.presence" \
                 build
          # Linking is not enough -- --gc-sections has eliminated these before.
          # Both names are absent from a defaults-only build; aliro_ec_p256_keygen
          # is not, because the Aliro credential path links it either way.
          xtensa-esp32s3-elf-nm "$B/esp32-reader-esp32s3-presence/woz_uwb_esp32s3.elf" \
            | grep -qE ' T presence_link_init$'
          xtensa-esp32s3-elf-nm "$B/esp32-reader-esp32s3-presence/woz_uwb_esp32s3.elf" \
            | grep -qE ' T aliro_assert_build_p256$'
          # C6 is the BU04 direct-SPI bring-up target. Keep it in a separate
          # build tree so the hardware-validated S3 sdkconfig/artifacts remain
          # unchanged and the RISC-V toolchain gets exercised explicitly.
          idf.py -B "$B/esp32-reader-esp32c6" \
                 -D SDKCONFIG="$B/esp32-reader-esp32c6/sdkconfig" \
                 set-target esp32c6
          idf.py -B "$B/esp32-reader-esp32c6" \
                 -D SDKCONFIG="$B/esp32-reader-esp32c6/sdkconfig" \
                 build
          # C5 is a shipped target -- release.yml builds and publishes a C5
          # Matter image -- but until now nothing compiled it before release
          # time, so a C5 break surfaced when a tag was cut. Same isolation as
          # C6: its own tree, target and sdkconfig.
          idf.py -B "$B/esp32-reader-esp32c5" \
                 -D SDKCONFIG="$B/esp32-reader-esp32c5/sdkconfig" \
                 set-target esp32c5
          idf.py -B "$B/esp32-reader-esp32c5" \
                 -D SDKCONFIG="$B/esp32-reader-esp32c5/sdkconfig" \
                 build
          # Compiling for RISC-V is not the same as keeping the CCC STS seam.
          # A caller that reaches past uwb_seam.h links clean, binds the real
          # dwt_* and silently never programs the STS key/IV. The source side is
          # covered by scripts/check-uwb-seam.sh in the verify gate; this is the
          # built-artifact side, which nothing else catches on the RISC-V
          # targets: test/verify_port.sh owns it but hardcodes an S3 build, and
          # never runs in CI anyway (the test-port gate has no ESP-IDF, so it
          # skips). Assert it on the artifacts already built.
          check_seam() {
            local dir="$1" tag="$2" h
            # Each helper must be defined somewhere, else the seam has no engine
            # behind it. Checked in the objects, not the ELF: --gc-sections drops
            # the ones the reader's default config never reaches, so the linked
            # image is not a sound place to look. Mirrors verify_port.sh §2.
            find "$dir" -name '*.obj' -exec riscv32-esp-elf-nm {} \; \
              2>/dev/null > "$dir-syms.txt"
            for h in woz_uwb_arm_rx woz_uwb_set_sts_iv woz_uwb_set_callbacks \
                     woz_uwb_configure_phy; do
              grep -qE " T $h$" "$dir-syms.txt" \
                || { echo "::error::$tag defines no $h — the STS seam is a no-op"; return 1; }
            done
            rm -f "$dir-syms.txt"
            # And the caller must go through it; uwb_min.c is the RX-arm caller
            # the seam exists for.
            local obj
            obj="$(find "$dir" -name 'uwb_min.c.obj' | head -1)"
            riscv32-esp-elf-nm "$obj" | grep -qE ' U woz_uwb_arm_rx$' \
              || { echo "::error::$tag uwb_min.c.obj does not call woz_uwb_arm_rx"; return 1; }
            riscv32-esp-elf-nm "$obj" | grep -qE ' U dwt_rxenable$' \
              && { echo "::error::$tag uwb_min.c.obj still calls dwt_rxenable directly"; return 1; }
            return 0
          }
          check_seam "$B/esp32-reader-esp32c6" C6
          check_seam "$B/esp32-reader-esp32c5" C5
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-idf-${{ github.run_id }}

  # Aliro initiator (User-Device role) — the bench HIL peer for our reader.
  # It links the same modules/woz_aliro core as the reader app but through the
  # opposite-direction device sources, so a reader-side codec change compiles
  # here or not at all. Without this job the app rots exactly the way the reader
  # job's presence build guards against: the two roles must stay codec-synced,
  # and nothing else in CI ever compiles the device half.
  esp32-initiator:
    if: contains(fromJSON('["all", "esp32", "esp32-initiator"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-initiator-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-initiator-
      - name: build the initiator app (esp32s3)
        working-directory: ports/esp32/apps/initiator
        # Steps bypass the image entrypoint, so source the IDF env explicitly.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          B="$GITHUB_WORKSPACE/build/esp32-initiator-esp32s3"
          idf.py -B "$B" -D SDKCONFIG="$B/sdkconfig" set-target esp32s3
          idf.py -B "$B" -D SDKCONFIG="$B/sdkconfig" build
          # Linking is not enough -- --gc-sections has eliminated reachable-looking
          # code before. These four are the device half's entry points: the state
          # machine, its init, the BleSK ranging-channel mirror, and the advert
          # decoder. If any is gone the app builds but cannot talk to a reader.
          for sym in aliro_device_on_command aliro_device_init \
                     aliro_dev_blesk_init aliro_ble_central_parse_adv; do
            xtensa-esp32s3-elf-nm "$B/aliro_initiator_esp32s3.elf" \
              | grep -qE " T $sym\$" || { echo "missing symbol: $sym" >&2; exit 1; }
          done
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-initiator-${{ github.run_id }}

  # Bootstrap the west workspace ONCE for the three nRF builds.
  #
  # They used to do it themselves, in parallel, on the same cache key: a cold
  # dispatch fetched ~8.5 GB three times over, and two of them then raced to
  # save the identical entry (the loser logs "unable to reserve cache"). Doing
  # it here means one upstream fetch, and the builds restore a cache entry from
  # GitHub's own storage instead -- far cheaper than three git fetches.
  #
  # LOOKUP-ONLY WHEN IT IS ALREADY WARM. There is no point downloading several
  # gigabytes into a job whose only purpose is to make sure they exist, and the
  # build jobs restore for themselves regardless (separate runners share no
  # disk). So a warm dispatch spends about twenty seconds here, and a cold one
  # pays the fetch exactly once.
  #
  # THE KEY is everything that shapes the workspace's content: the pin record
  # (west.yml), the applier (scripts/bootstrap.sh, where the add-on pin, the
  # NCS version and the patch list live) and the patch files themselves, so
  # patch drift forces a cold bootstrap.
  #
  # Deliberately no restore-keys: bootstrap.sh cannot re-patch a workspace that
  # already carries another patch state (patches that add files leave untracked
  # files behind), so a near-miss cache would poison every build downstream of
  # it -- which is now all three of them rather than one.
  #
  # It does not gate the ESP jobs, which share nothing with it.
  workspace:
    if: contains(fromJSON('["all", "nrf", "dwm3001cdk", "nrf5340dk", "nrf5340dk-aliro-blob"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    defaults:
      run:
        # bash so the container's BASH_ENV hook puts west on PATH; bootstrap.sh
        # has a bash shebang and would source it anyway, but the guard step
        # below runs inline.
        shell: bash
    env:
      ALIRO_TOOLCHAIN: env
      ALIRO_SHALLOW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is the workspace already cached
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
          # Existence, not contents: nothing here uses the workspace.
          lookup-only: true
      - name: bootstrap it (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        # One retry: bootstrap is resumable (the fetch sentinel means a rerun
        # picks up where an interrupted west update stopped), so a transient
        # fetch failure costs one resume, not the whole multi-GB fetch.
        run: |
          ./scripts/bootstrap.sh || {
            echo "::warning::bootstrap failed once — retrying (resumes the fetch)"
            ./scripts/bootstrap.sh
          }
      - name: save it (cold cache)
        if: steps.ws.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: ${{ steps.ws.outputs.cache-primary-key }}

  # Default nRF5340 DK Zephyr/NCS build, including the in-tree Aliro source
  # stack. The workspace it builds against comes from the job above.
  nrf5340dk:
    needs: workspace
    if: contains(fromJSON('["all", "nrf", "nrf5340dk"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      # NCS toolchain container matching west.yml's NCS v3.3.0. Its BASH_ENV
      # hook sources the toolchain env (west, Zephyr SDK on PATH) in every
      # non-interactive bash, so the scripts run with ALIRO_TOOLCHAIN=env: the
      # default nrfutil launcher would look for its toolchain index under
      # $HOME, which the runner overrides away from the image's /opt.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    env:
      ALIRO_TOOLCHAIN: env
      # History-free fetch of exactly the pinned revisions: the same tree
      # state at a fraction of the size, so bootstrap and the workspace cache
      # are both much faster. The bench default keeps full clones.
      ALIRO_SHALLOW: "1"
      # 300M, not 1G, and the reason is the repository cache budget rather than
      # this job. GitHub gives a repository 10 GB of Actions cache and evicts by
      # LRU. Every ccache here uses a run-unique key, so a full run writes a
      # brand-new entry per job — nine of them as of this count (esp32-idf,
      # esp32-initiator, nrf5340dk, nrf5340dk-aliro-blob, dwm3001cdk, and the
      # esp32-matter matrix's four legs, each keyed on matrix.leg). At 300M that
      # is up to 2.7 GB of fresh cache on an `all` dispatch, against the two
      # entries that are actually expensive to rebuild: nrf-workspace and
      # esp-matter. Losing either turns a warm build into a cold multi-GB
      # upstream fetch. A smaller ccache costs a few minutes of compile; an
      # evicted workspace or esp-matter cache costs the rest of the job.
      #
      # THE `targets` DISPATCH INPUT IS THE BIGGER LEVER HERE. Nine entries only
      # happen on `all`; dispatching one job writes one. Re-count this comment
      # if the job list changes — the number is read off the workflow, not
      # carried in memory, so it drifts the moment a job is added and nobody
      # updates the count by hand.
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the bootstrapped west workspace
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-${{ github.run_id }}
          restore-keys: |
            ccache-nrf5340dk-
      - name: build (nrf5340dk/nrf5340/cpuapp, sysbuild)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ./scripts/build-nrf5340dk.sh build
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-${{ github.run_id }}

  # Compatibility build for the legacy Nordic Aliro archive. The normal
  # nrf5340dk job above compiles the in-tree source stack; this sibling proves
  # ALIRO_SOURCE=0 remains usable for regression isolation. It shares the
  # bootstrapped workspace cache because the choice is compile-time only, but
  # has a distinct compiler cache.
  nrf5340dk-aliro-blob:
    needs: workspace
    if: contains(fromJSON('["all", "nrf", "nrf5340dk-aliro-blob"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    env:
      ALIRO_TOOLCHAIN: env
      ALIRO_SHALLOW: "1"
      # See the nrf5340dk job above for why this is 300M and not 1G.
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the bootstrapped west workspace
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-aliro-blob-${{ github.run_id }}
          restore-keys: |
            ccache-nrf5340dk-aliro-blob-
      - name: build (nrf5340dk/nrf5340/cpuapp, sysbuild, ALIRO_SOURCE=0)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ALIRO_SOURCE=0 ./scripts/build-nrf5340dk.sh build
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-nrf5340dk-aliro-blob-${{ github.run_id }}

  # The DWM3001CDK, this repository's primary target: reader + Matter node +
  # OpenThread MTD in one nRF52833 image, plus the standalone reader build.
  # Both come straight from firmware/ -- no add-on, no patches -- so this job
  # needs the same NCS container and workspace as the nRF5340 DK jobs but none
  # of their bootstrap patch state. It restores the same workspace cache those
  # jobs populate and never saves it: a hit is the fast path, and a miss just
  # bootstraps, so this job can never poison an entry the DK jobs depend on.
  #
  # ALIRO_TOOLCHAIN=env for the reason the DK jobs give: inside this container
  # the toolchain is already on PATH and nrfutil's toolchain index is not
  # reachable, so mk/cdk.mk must skip the nrfutil launcher.
  #
  # The two images are built into separate directories on purpose. `-p auto`
  # re-runs CMake when the board or application directory changes and NOT when
  # the -D flags do, so one directory holding both configurations in turn would
  # silently keep whichever it configured first.
  dwm3001cdk:
    needs: workspace
    if: contains(fromJSON('["all", "nrf", "dwm3001cdk"]'), inputs.targets)
    runs-on: ubuntu-latest
    defaults:
      run:
        # BASH, NOT THE DEFAULT sh, and this is what makes `make` resolvable.
        # The NCS container puts west, the Zephyr SDK and its own make on PATH
        # through a BASH_ENV hook, which bash sources for every non-interactive
        # shell and sh never does. Actions runs container steps with `sh -e {0}`
        # by default, so a step calling `make` straight out of the runner died
        # with "make: not found" and exit 127. The nrf5340dk jobs never hit it
        # because they invoke scripts/*.sh, whose bash shebangs fire the hook
        # inside the script.
        shell: bash
    timeout-minutes: 180
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276 # v3.3.0
    env:
      ALIRO_TOOLCHAIN: env
      ALIRO_SHALLOW: "1"
      # See the nrf5340dk job above for why this is 300M and not 1G.
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore the bootstrapped west workspace
        id: ws
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace
          key: nrf-workspace-${{ hashFiles('west.yml', 'scripts/bootstrap.sh', 'ports/nrf5340dk/patches/**') }}
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-dwm3001cdk-${{ github.run_id }}
          restore-keys: |
            ccache-dwm3001cdk-
      - name: make sure make exists
        # THE NCS CONTAINER HAS NO make. Its toolchain bundle ships cmake, ninja
        # and ccache -- an NCS build is CMake and Ninja end to end -- so nothing
        # in it ever needed one, and the base image does not carry one either.
        # `make dfu-key` therefore died with "make: not found" and exit 127.
        #
        # The nrf5340dk jobs never hit this because they invoke scripts/*.sh
        # directly. The CDK recipes live in mk/cdk.mk and make IS the interface,
        # here and on a contributor's bench; reimplementing them inline would be
        # a second copy that drifts from the one people actually run.
        #
        # Paired with `defaults.run.shell: bash` above, which is a separate fix
        # for a separate half: bash sources the container's BASH_ENV hook and
        # that is what puts west and the Zephyr SDK on PATH for the recipes.
        # Installing make without it gets a make that cannot find west.
        run: |
          if command -v make >/dev/null 2>&1; then
            echo "make $(make --version | head -1)"
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends make
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache make
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q make
          else
            echo "::error::no make and no package manager to install one"
            exit 1
          fi
          command -v make
      - name: generate a throwaway MCUboot signing key
        # Throwaway ON PURPOSE, not a repository secret. These artifacts are
        # build verification, nothing more, and a real key in the CI secret
        # store would be a key that signs images a deployed lock accepts.
        # A key has to exist before either image will even configure:
        # firmware/sysbuild.cmake fails the build rather than let it fall back
        # to MCUboot's PUBLISHED demo key. See firmware/keys/README.md.
        run: make dfu-key
      - name: build the Matter over Thread image (decawave_dwm3001cdk)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          make build
      - name: build the SHIPPING image (decawave_dwm3001cdk, SMP + RELEASE + LTO)
        # The configuration that actually goes on a board: what `make release`
        # builds and what `make fota` pushes over Bluetooth.
        #
        # UNTIL THIS STEP, NOTHING IN CI COMPILED IT. release.yml is the only
        # other workflow that builds it and that one is tag-only, so the image
        # every user installs was the least-built configuration in the tree --
        # a Kconfig or flash-fit break in it would have surfaced while cutting a
        # release, which is the worst possible time to find one. The step above
        # does not cover it: RELEASE and SMP change the Kconfig tree, the RAM
        # budget and the partition fit, in opposite directions on each region.
        #
        # Its own build directory, because `-p auto` does not re-run CMake when
        # a -D flag changes (see CDK_PRISTINE in mk/cdk.mk), so one directory
        # holding both configurations in turn would silently keep the first.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          make build SMP=1 RELEASE=1 CDK_BUILD=build/cdk-shipping
      - name: build the standalone reader image (decawave_dwm3001cdk)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          make reader
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: all three images exist and fit
        # The build fails on overflow by itself; this asserts the artifacts are
        # actually there, so a recipe that silently stopped building one of them
        # cannot pass as green.
        run: |
          test -f build/cdk-matter/merged.hex
          test -f build/cdk-shipping/merged.hex
          test -f build/cdk-reader/firmware/zephyr/zephyr.hex
      - name: what the images cost
        # MEASURES, DOES NOT GATE. cdk-size.yml is the gate; here the builds have
        # already happened, so the reports are close to free and worth having in
        # the summary of every dispatch. Not `cdk-size-check`: this workflow is
        # about whether the trees still compile, and a headroom regression is not
        # a reason to call a build broken.
        #
        # The SHIPPING image first, because it is the one cdk-size.yml gates and
        # the one whose headroom decides what can still be added. Reporting only
        # the debug build here would have put the configuration CI does NOT gate
        # at the top of every dispatch summary.
        env:
          CDK_SIZE_TOOLCHAIN: sha256:f24d8932ff081ebcd8da9c248f4449bdabe461c0620a7a4ac9e95eb577ba2276
        run: |
          make cdk-size SMP=1 RELEASE=1 CDK_BUILD=build/cdk-shipping
          make cdk-size
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-dwm3001cdk-${{ github.run_id }}

  # Fetch + install esp-matter ONCE for the four esp32-matter legs.
  #
  # They used to do it themselves, each restoring the same static cache key and
  # each cloning esp-matter + CHIP on a miss: the job's own comment already
  # named this as "the worst thing this workflow can do" and left it as a known
  # gap rather than a bug, with a note that the eventual fix should be one leg
  # on a schedule, not a nightly building four. This is that fix, shaped like
  # the nRF workspace job above: one clone, then everyone restores.
  #
  # LOOKUP-ONLY WHEN WARM, same reasoning as the workspace job: nothing here
  # needs the ~6+ GB tree itself, only the fact that the cache entry exists.
  # Each matrix leg still restores it for real.
  #
  # THE KEY IS STATIC (env.ESP_MATTER_REV, only an esp-matter revision or an
  # IDF bump moves it), so unlike the west workspace this entry does not churn
  # on ordinary pushes. It ages out only from seven days with no access at all,
  # which the esp32-matter job's own restores keep resetting on any week it
  # runs — this job is the fallback for a week it does not.
  esp-matter-prep:
    if: contains(fromJSON('["all", "esp32", "esp32-matter"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      ESP_MATTER_REV: 93b168027bf95f4e467230345ad1f2d147eb1f6b
      ESP_MATTER_PATH: /opt/esp/esp-matter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is esp-matter already cached
        id: esp-matter
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/esp-matter
          key: esp-matter-${{ env.ESP_MATTER_REV }}-idf-v5.5.4
          lookup-only: true
      # See the esp32-matter job for why this has to be installed before any
      # pip install can succeed in this container.
      - name: install python build headers
        if: steps.esp-matter.outputs.cache-hit != 'true'
        run: apt-get update -q && apt-get install -y -q python3-dev
      - name: fetch + install esp-matter (cold cache)
        if: steps.esp-matter.outputs.cache-hit != 'true'
        # Identical to what the esp32-matter job ran per leg; see there for why
        # each line is what it is. Kept in exactly one place now instead of two.
        run: |
          . "$IDF_PATH/export.sh"
          setup() (
            rm -rf "$ESP_MATTER_PATH" &&
            git init -q "$ESP_MATTER_PATH" &&
            cd "$ESP_MATTER_PATH" &&
            git remote add origin https://github.com/espressif/esp-matter.git &&
            git fetch -q --depth 1 origin "$ESP_MATTER_REV" &&
            git checkout -q FETCH_HEAD &&
            git submodule update --init --depth 1 &&
            ./connectedhomeip/connectedhomeip/scripts/checkout_submodules.py \
              --platform esp32 linux --shallow &&
            sed -i 's/cffi==1.15.0/cffi==1.17.1/' \
              connectedhomeip/connectedhomeip/scripts/setup/constraints.txt \
              connectedhomeip/connectedhomeip/scripts/setup/requirements.all.txt &&
            sed -i 's/bitarray==2.6.0/bitarray==2.8.2/' \
              connectedhomeip/connectedhomeip/scripts/setup/requirements.esp32.txt &&
            ./install.sh --no-host-tool
          )
          setup || {
            echo "::warning::esp-matter setup failed once — retrying from scratch"
            setup
          }
      - name: save the esp-matter cache (cold cache)
        if: steps.esp-matter.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/esp-matter
          key: esp-matter-${{ env.ESP_MATTER_REV }}-idf-v5.5.4

  # ESP32-S3 Matter door lock against esp-matter at the bench-validated
  # revision (6+ GB once the CHIP submodule tree is in). The esp-matter tree
  # (including CHIP's CIPD-fetched gn/zap under .environment) is cached on a
  # static key: its revision is pinned, so only a revision or IDF bump rolls it.
  #
  # This is the job PR #89 taught the most: it shipped C6 target definitions that
  # nothing compiled until the post-merge push. Adding or editing a sdkconfig
  # defaults file or a partition table is the change most likely to break this
  # build and the least likely to be caught by review, so dispatch this workflow
  # when a pull request touches one.
  esp32-matter:
    needs: esp-matter-prep
    if: contains(fromJSON('["all", "esp32", "esp32-matter"]'), inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # One leg per image. Measured on run 30595579021, the three builds ran
    # sequentially inside one job for 23 min: 4.5 + 4.5 + 10.9 min of build,
    # each carrying its own CHIP compile. In parallel the job is as slow as its
    # slowest leg instead of their sum. Not a caching fix -- ccache was already
    # at 91.9% hits there, and the saved cache was 264 MB against a 1G limit --
    # the cost was simply three builds in a row.
    #
    # fail-fast off: one target breaking is exactly when the others' results
    # are most worth having.
    #
    strategy:
      fail-fast: false
      matrix:
        leg: [esp32s3, esp32s3-presence, esp32c6, esp32c5]
    container:
      image: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    env:
      # The bench-validated esp-matter revision; the cache key derives from it.
      ESP_MATTER_REV: 93b168027bf95f4e467230345ad1f2d147eb1f6b
      ESP_MATTER_PATH: /opt/esp/esp-matter
      IDF_CCACHE_ENABLE: "1"
      # See the nrf5340dk job for why this is 300M and not 1G. It matters most
      # here: this is the only matrix job, so it writes one fresh ccache per leg.
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # esp-matter-prep populated this; every leg here just restores it.
      # A miss here (the prep job failed, or this ran without it -- see
      # `needs` above, which should make that impossible) is a hard stop:
      # there is no per-leg fallback fetch any more, on purpose, since a
      # fallback here is exactly the four-way clone this was written to end.
      - name: restore esp-matter
        id: esp-matter
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/esp-matter
          key: esp-matter-${{ env.ESP_MATTER_REV }}-idf-v5.5.4
      # Python build headers, unconditionally. install.sh in esp-matter-prep
      # already needed these once; this job still needs them for the pip
      # install below on a warm cache, and each matrix leg is a fresh
      # container that starts with none of them.
      #
      # esp-matter's own requirements.txt and CHIP's setup pin packages whose
      # old versions ship no cp312 wheel, so pip compiles them from source
      # against the container's python 3.12 -- and this ubuntu:24.04 image has
      # no Python.h without this. esp-matter-prep's version seds cover CHIP's
      # own pinned files; this covers everything else that might build from
      # source, here and in future domino pins neither of us controls.
      - name: install python build headers
        run: apt-get update -q && apt-get install -y -q python3-dev
      - name: install the esp-matter python deps (warm cache)
        if: steps.esp-matter.outputs.cache-hit == 'true'
        # install.sh put these into the IDF python env, which lives in the
        # container image, not in the cache — reinstate them on cache hits.
        run: |
          . "$IDF_PATH/export.sh"
          python3 -m pip install -q -r "$ESP_MATTER_PATH/requirements.txt"
      # See the esp32-idf job for the ccache key/restore-keys rationale.
      # Covers the IDF-side components; the CHIP core built through GN keeps
      # its own compile times.
      #
      # Keyed per leg, which the matrix makes mandatory rather than optional:
      # a shared key would have every leg race to save a cache holding only its
      # own target's objects, and whichever won would be the one all the others
      # restore next run. Per-leg caches are also each smaller than the single
      # 264 MB one they replace, so the restore is quicker too.
      - name: restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-matter-${{ matrix.leg }}-${{ github.run_id }}
          restore-keys: |
            ccache-esp32-matter-${{ matrix.leg }}-
      # Every idf.py invocation below is byte-identical to the sequential
      # version this replaced; only which leg runs which has changed. The legs
      # no longer subsume each other's failures the way the old comments
      # described, because they no longer share a job -- see the notes per leg.
      - name: build the matter-lock app (${{ matrix.leg }})
        working-directory: ports/esp32/apps/matter-lock
        env:
          LEG: ${{ matrix.leg }}
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          # One build root for the whole repo, the same tree `make esp-build` uses.
          B="$GITHUB_WORKSPACE/build"
          case "$LEG" in
          esp32s3)
            # The shipping image, and the only leg that catches code which
            # compiles ONLY with presence on (an unused declaration outside the
            # guard, say) -- the presence leg is a strict superset of these
            # sources, since every CONFIG_WOZ_PRESENCE site in this app is a
            # bare #ifdef with no #else.
            idf.py -B "$B/esp32-matter-lock-esp32s3" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32s3/sdkconfig" set-target esp32s3
            idf.py -B "$B/esp32-matter-lock-esp32s3" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32s3/sdkconfig" build
            ;;
          esp32s3-presence)
            idf.py -B "$B/esp32-matter-lock-esp32s3-presence" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32s3-presence/sdkconfig" \
                   -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.presence' \
                   build
            # Linking is not enough -- --gc-sections has eliminated the P-256
            # code from an image that built cleanly before. presence_link_cmd is
            # the app-facing one: it is what registers the console command, so
            # it is absent exactly when this app's own presence wiring has
            # rotted.
            xtensa-esp32s3-elf-nm "$B/esp32-matter-lock-esp32s3-presence/door_lock.elf" \
              | grep -qE ' T presence_link_cmd$'
            ;;
          esp32c6)
            # The default Matter image for the single-core C6.
            idf.py -B "$B/esp32-matter-lock-esp32c6" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32c6/sdkconfig" \
                   set-target esp32c6
            idf.py -B "$B/esp32-matter-lock-esp32c6" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32c6/sdkconfig" \
                   build
            ;;
          esp32c5)
            # release.yml publishes a C5 Matter image, but nothing compiled C5
            # before a tag was cut, so a C5 break used to surface during a
            # release. Same recipe release.yml uses, run on every push instead.
            idf.py -B "$B/esp32-matter-lock-esp32c5" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32c5/sdkconfig" \
                   set-target esp32c5
            idf.py -B "$B/esp32-matter-lock-esp32c5" \
                   -D SDKCONFIG="$B/esp32-matter-lock-esp32c5/sdkconfig" \
                   build
            ;;
          *)
            echo "::error::no build recipe for matrix leg '$LEG'"; exit 1
            ;;
          esac
          { command -v ccache >/dev/null && ccache -s | head -n 6; } || echo "no ccache on PATH"
      - name: save the compiler cache
        if: always() && inputs.save_ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-esp32-matter-${{ matrix.leg }}-${{ github.run_id }}
