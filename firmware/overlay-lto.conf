# Link-time optimisation for the Matter over Thread image.
#
# Build with:
#   make build LTO=1
#
# BOTH LINES ARE REQUIRED, and this is the trap worth knowing. `CONFIG_LTO=y` on
# its own is a silent no-op: the symbol depends on
#   !(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION
# (zephyr/Kconfig.zephyr:526-528). With that dependency unmet Kconfig does not
# merely leave LTO off, it drops the symbol from the generated .config entirely,
# and emits no warning while doing it. Never trust a size number from this
# overlay without grepping build/<dir>/firmware/zephyr/.config for BOTH symbols.
#
# NOT THE DEFAULT, and the reason is not caution in general. LTO is whole-program
# codegen on an image whose UWB ranging path has a ~1836 us arm deadline, and a
# smaller binary is no evidence at all that the deadline still holds. The only
# check that proves it is a walk-up unlock on hardware. Make that pass before
# this becomes the default.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
