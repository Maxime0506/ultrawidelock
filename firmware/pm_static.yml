# DWM3001CDK flash map, pinned.
#
# WHY THIS FILE EXISTS AT ALL. Partition Manager derives a perfectly good map on
# its own, and until MCUboot arrived this port deliberately had no pm_static.yml
# (see boards/decawave_dwm3001cdk.overlay, which explains why the DTS partition
# nodes are inert here). What changed: settings_storage now has a bootloader in
# front of it. The derived map is only stable as long as every input to it is,
# and the one partition whose address MUST NOT MOVE is settings_storage --
# it holds the Matter fabrics, the trust anchors and the reader private key, and
# a board is reflashed with plain `west flash`, never `--erase`, precisely so
# that 0x7e000 survives the update. An address that drifts because MCUboot grew
# by a sector would silently orphan all of it. So it is pinned.
#
# EVERY NUMBER BELOW IS MEASURED, not budgeted. Sources, all at this commit:
#
#   MCUboot           29,360 B   sysbuild image, build/cdk-matter/mcuboot
#                                (29,328 B standalone; PM integration adds 32 B)
#   application      405,296 B   linker FLASH region, build/cdk-matter/firmware
#   app signed       405,960 B   firmware/zephyr/zephyr.signed.bin -- the raw
#                                image plus 664 B of MCUboot header and
#                                ECDSA-P256 TLVs. Read off the file, not derived.
#                                (The TLV block varies a byte or two run to run:
#                                DER strips leading zeros from r and s.)
#
# ---------------------------------------------------------------------------
#  0x00000  mcuboot            40,960 B   29,360 used, 11,600 free
#  0x0a000  mcuboot_pad           512 B   image header
#  0x0a200  app               433,664 B   409,536 linked (94.44%)
#  0x74000  patch_staging      40,960 B   one OTA delta patch
#  0x7e000  settings_storage    8,192 B   UNCHANGED from the pre-MCUboot map
#  0x80000  end                           40,960 + 512 + 433,664 + 40,960 +
#                                         8,192 = 524,288, the part exactly
# ---------------------------------------------------------------------------
#
# WHY MCUBOOT GREW FROM 32,768 B, AND WHY THE APP GAVE UP 40,960 B TO A PATCH.
# Both are the BLE OTA path. This board cannot
# do a conventional over-the-air update and the arithmetic is not close: two
# full slots want 844 KB of a 512 KB part, and an LZMA-compressed secondary
# still wants ~646 KB. There is no external flash to stage into either -- no
# jedec,spi-nor node in the board DTS. What fits is a DELTA: measured between
# two adjacent LTO builds of this image, an in-place patch is 10,906 B.
#
#   patch_staging  40,960 B   one patch and its control pages; nothing else
#                             may live here, because MCUboot erases the whole
#                             partition after a successful apply. Sized by
#                             measurement -- see the note on the partition.
#   mcuboot        +8,192 B   the detools in-place applier and heatshrink,
#                             which run in the bootloader because the
#                             application cannot rewrite the flash it is
#                             executing from. MEASURED: the applier costs
#                             3,176 B (29,380 -> 32,556), so the partition
#                             ends at 79.48% with 8,404 B still free. The
#                             grant is four sectors rather than one because
#                             0x8000 would have left 212 B, and a bootloader
#                             with 212 B of margin is one commit from an
#                             overflow in the image that has to still work
#                             when the application does not.
#
# The application still has room: 433,664 - 409,536 = 24,128 B, of which
# detools wants ~8 KB as forward-shift slack INSIDE this partition (it shifts
# the old image forward to patch backwards over it). That leaves ~16 KB. The
# image grew about 4 KB across the whole session that built this update path,
# so that is months of headroom rather than weeks -- but it IS the number to
# watch, because the app and the staging partition are now competing for the
# same bytes. Both remain build-time constraints: an image that outgrows its
# partition fails `west build`, it does not ship.
#
# THIS MAP ONLY WORKS POST-LTO, and that is a change from the version before it.
# LTO became the default 2026-08-02 once a walk-up unlock validated it on
# hardware, and it is worth 41,084 B: the same image measures 446,380 B without
# it. The map it replaced had 482,816 B for the application, so `make build
# LTO=0` still fitted there. It does NOT fit here -- 446,380 B against 433,664 B
# overflows by 12,716 B -- and the build says so rather than shipping. An LTO=0
# build of this configuration needs the staging partition dropped.
#
# WHY 0xA000 FOR MCUBOOT. It was 0x8000, chosen when the bootloader measured
# 29,360 B and nothing was going to be added to it. The delta applier changes
# that: detools plus heatshrink plus the glue is ~7 KB and it has to live in the
# bootloader, because an application cannot rewrite the flash it is executing
# from. 0x8000 left 3,408 B, which does not hold it. 0xA000 leaves 11,600 B.
#
# Left to itself PM gives mcuboot 48 KB (0xC000), which measured 59.73% used
# while the application sat at 95.32% of what was left. That is still the reason
# not to take PM's own answer: it hands margin to the image that does not need
# it. 0xA000 is the smallest boundary that fits the applier with room to grow,
# and a bootloader that outgrows it fails `west build` with a PM overflow --
# a loud failure on a developer's machine, not a field one.
#
# HOW TO CHECK THIS FILE IS STILL TRUE
#   west build -d <build> -t partition_manager_report
#   diff <(cat <build>/partitions.yml) — settings_storage must read 0x7e000/0x2000
#
# NOTHING HERE MAY LOCK APPROTECT, and no partition change makes that safe:
# `nrfjprog --recover` erases UICR too, so it takes settings_storage with it and
# every iPhone key provisioned against this board dies. scripts/check-approtect.sh
# is the gate.

mcuboot:
  address: 0x0
  end_address: 0xa000
  region: flash_primary
  size: 0xa000
  placement:
    align:
      end: 0x1000
    before:
      - mcuboot_primary

mcuboot_pad:
  address: 0xa000
  end_address: 0xa200
  region: flash_primary
  size: 0x200
  placement:
    align:
      start: 0x1000
    before:
      - mcuboot_primary_app

# `app` is the application's own payload region: what the linker sizes the image
# against, and what mcuboot_primary_app spans. It starts after the pad because
# the pad is where MCUboot writes the image header.
app:
  address: 0xa200
  end_address: 0x74000
  region: flash_primary
  size: 0x69e00

mcuboot_primary_app:
  address: 0xa200
  end_address: 0x74000
  region: flash_primary
  size: 0x69e00
  orig_span: &id002
    - app
  span: *id002

# The slot MCUboot validates and boots: the header plus the payload. With
# CONFIG_SINGLE_APPLICATION_SLOT there is no secondary and no swap status area,
# so the only reserved tail is the boot trailer -- BOOT_MAX_ALIGN * 4 +
# BOOT_MAGIC_ALIGN_SIZE, tens of bytes (bootutil_area.c, boot_trailer_info_sz).
# imgtool enforces the real limit at sign time against this size, so an image
# that no longer fits fails the build rather than the boot.
mcuboot_primary:
  address: 0xa000
  end_address: 0x74000
  region: flash_primary
  size: 0x6a000
  orig_span: &id001
    - app
    - mcuboot_pad
  span: *id001

# Where a BLE OTA lands. The application writes a received delta patch here and
# reboots; MCUboot applies it onto mcuboot_primary and then erases this
# partition. Nothing else may be stored here, and nothing here survives an
# update.
#
# The first 4,096 B page is the control page, not patch data. It carries the
# header the application writes after it has checked the patch signature
# (magic, patch length, the SHA-256 the patch must hash to, and the SHA-256 of
# the image it applies to), and it carries detools' step counter -- one word per
# completed step, appended without erasing, so that a power cut mid-apply
# resumes at the right step instead of restarting into a half-patched image.
# detools drives that counter itself through its step_set/step_get callbacks
# (detools.c:1559 skips any step already recorded complete).
#
# 40,960 B, and it was 32,768 B until a MEASUREMENT moved it. Patch size is
# driven by how far code SHIFTS, not by how much of it changed:
#
#   build timestamp only, no code change      7,632 B
#   fifty-two bytes of new code              17,335 B
#
# Two small functions added near the top of a file move every symbol after
# them, and the delta pays for all of it. 17,335 B was 70.5% of the old
# 24,576 B budget for a change that is barely visible in a diff, so a real
# feature would not have fitted and the patch builder would have refused it.
#
# The usable budget is this size less the two control pages: 32,768 B.
#
# GROWING IT AGAIN IS EXPENSIVE. A partition move is a flash map change, and
# a flash map change is the one thing an over-the-air update cannot deliver:
# it needs a cable on every board that already exists. This was done while
# exactly one board existed. Decide it early or not at all.
patch_staging:
  address: 0x74000
  end_address: 0x7e000
  region: flash_primary
  size: 0xa000
  placement:
    align:
      start: 0x1000
    before:
      - settings_storage

# DO NOT MOVE. The reader identity and the Matter fabrics live here, and
# `west flash` without --erase is what preserves them across an update --
# MEASURED: merged.hex spans 0x0..0x75274 and so stops 36,236 B short of this
# partition.
#
# BACKING IT UP IS NOT `aliro export yes`. That command does not exist on the
# Matter image: overlay-thread.conf sets CONFIG_ALIRO_PROV_CONSOLE=n and
# CONFIG_SHELL=n, so prov_shell.c is never compiled and there is no shell and no
# USB console on the board whose loss would actually hurt. Only the standalone
# cdk-reader build keeps it. Back this partition up over SWD instead, which also
# captures the Matter fabrics that `aliro export` never did:
#
#   JLinkExe -device nRF52833_xxAA -if SWD -speed 4000 -autoconnect 1 \
#     -CommanderScript <(printf 'savebin s.bin 0x7E000 0x2000\nexit\n')
#
# Then check the result is 8,192 B and not all 0xFF before trusting it: an
# erased page saves silently and looks exactly like a backup.
settings_storage:
  address: 0x7e000
  end_address: 0x80000
  region: flash_primary
  size: 0x2000
  placement:
    align:
      start: 0x1000
    before:
      - end

sram_primary:
  address: 0x20000000
  end_address: 0x20020000
  region: sram_primary
  size: 0x20000
