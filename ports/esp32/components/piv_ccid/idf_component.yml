## Managed dependency for the CCID transport's native-USB path. Declared on the
## component rather than on one app so every app that pulls piv_ccid resolves
## it; CMakeLists.txt requires these only on esp32s3, and the rule below scopes
## the download to match. Version tracks apps/matter-lock/main/idf_component.yml.
dependencies:
  espressif/esp_tinyusb:
    # Exact, matching apps/matter-lock/main/idf_component.yml. A range here would let the two
    # manifests resolve to different builds of the same component. 2.2.1 is the only release in
    # the ^2.2.1 range today, so this pin changes nothing about what compiles.
    version: "2.2.1" # was ^2.2.1
    rules:
      - if: "target in [esp32s3]"
