# Bring-up overlay: fire the one-shot UWB init self-test at boot.
#
# This is the stage-3 check. modules/woz_uwb/src/driver/uwb_selftest.c runs the
# full Aliro UWB start path against a dummy URSK, and uwb_min.c logs the raw
# DEV_ID it read over SPI (expect 0xDECA03xx). A wrong pin, a wrong SPI mode or
# an unpowered DW3110 all show up here as 0x00000000 or 0xFFFFFFFF.
#
# Not in prj.conf: this is a diagnostic, and on a single-core part the extra
# logging is exactly the kind of thing that perturbs the delayed-TX window.
#
#   west build -b decawave_dwm3001cdk -d <build> <app> \
#       -- -DEXTRA_CONF_FILE=overlays/uwb-selftest.conf
CONFIG_WOZ_UWB_SELFTEST=y
CONFIG_WOZ_UWB_SELFTEST_DELAY_MS=2000

# INF, deliberately NOT DBG. Global DBG turns on debug logging for every Zephyr
# module, including the arch MPU code that reprograms regions on each context
# switch — it floods RTT and wraps the buffer before you can read anything.
# Everything this overlay exists to see is INF or ERR already: the DEV_ID line
# (uwb_min.c:69) and the probe-failure diagnosis (uwb_min.c:80).
CONFIG_LOG_DEFAULT_LEVEL=3
