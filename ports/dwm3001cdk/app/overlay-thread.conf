# Thread on the DWM3001CDK, alongside BLE and the reader.
#
# Build with:
#   west build -b decawave_dwm3001cdk ports/dwm3001cdk/app \
#     -- -DEXTRA_CONF_FILE=overlay-thread.conf -DCONFIG_ALIRO_MATTER_BLE=y
#
# MEASURED on nRF52833 (516,096 B app slot / 131,072 B RAM), reader + Matter
# node + Thread MTD: 415,416 B flash (80.5%) / 120,120 B RAM (91.6%). RAM is
# the binding constraint, not flash, and every entry below that costs RAM says
# what it bought.

# ---- the stack ------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=3000

# Matter over Thread registers its operational service with the border router
# over SRP, so this is not optional once CASE has to be reachable.
CONFIG_OPENTHREAD_SRP_CLIENT=y

# Stateless address autoconfiguration. Defaults OFF, and without it this node
# holds ONLY mesh-local and link-local addresses -- so a commissioner resolves
# its SRP name, gets an address that does not leave the Thread mesh, and hangs.
# Measured exactly that: attached as a child in 2,500 ms, then twenty seconds
# with no off-mesh-routable address, because SLAAC is what builds one from the
# prefix the border router publishes. Nothing about being ON a network makes a
# node REACHABLE on it.
CONFIG_OPENTHREAD_SLAAC=y

# Do NOT bring Thread up at boot. This node has no dataset until Apple sends
# one, and a stack that starts without credentials scans, fails, and retries
# for the whole commissioning window -- on a radio BLE is sharing.
# matter_thread_start() starts it, the moment there is something to start with.
CONFIG_OPENTHREAD_MANUAL_START=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# ---- what is left out -----------------------------------------------------
#
# Sockets sit above UDP and a Matter node calling otUdp* never touches them.
# UDP itself has to stay: connection.c compiles under NET_IPV6, but the
# CONFIG_NET_MAX_CONN it uses depends on a transport, so NET_IPV6=y with
# NET_UDP=n does not build upstream.
CONFIG_NET_SOCKETS=n

# The USB provisioning console. A Matter node self-provisions from Apple Home,
# which is what makes `aliro import` redundant HERE and nowhere else -- the
# non-Matter reader build still needs it.
CONFIG_ALIRO_PROV_CONSOLE=n
CONFIG_SHELL=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n

# ---- RAM reclamation ------------------------------------------------------
#
# Zephyr's net buffers are sized for general IP routing. This node carries one
# Matter UDP flow to one border router. Worth 3,744 B, and the worst case if
# they are too small is a dropped packet, which Matter's MRP already
# retransmits.
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=8

# CONFIG_MBEDTLS_HEAP_SIZE was on this list as "do not touch, starving it
# breaks unlocks on a path nothing exercises". It has since been MEASURED at a
# 228 B peak and cut to 4096 in prj.conf, which is where the argument should
# have started. The caution was right about the unlock path and wrong about the
# size: measure first, and the number settles it.
#
# DELIBERATELY NOT REDUCED:
#
#   OpenThread and net stacks     ~2,800 B, paid for with an MPU stack-guard
#                                 fault under load -- which on this board has
#                                 already once presented as a hang. Size these
#                                 from CONFIG_THREAD_ANALYZER_AUTO, never by
#                                 estimate; two stacks in this project were
#                                 guessed low and both faulted on hardware.
#   CONFIG_NRF_802154_RX_BUFFERS  default 20, 2,580 B measured (129 B each). A
#                                 1,024 B Sigma3 arrives as ~11-12 6LoWPAN
#                                 fragments, so cutting to 8 would leave less
#                                 than one CASE message of margin on a radio
#                                 the OT thread shares with BLE and the DW3110
#                                 ISR queue.
#   OPENTHREAD_NUM_MESSAGE_BUFFERS  IMPOSSIBLE, not merely unwise. NCS pins it
#                                 at `range 64 65535` for an MTD
#                                 (nrf/subsys/net/openthread/Kconfig.defconfig)
#                                 and 64 is already the effective value, so a
#                                 lower setting aborts the build.
