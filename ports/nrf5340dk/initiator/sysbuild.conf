# The nRF5340's radio is on the network core, so an app-core BLE app is only half
# an image: without a controller built for the net core the host comes up and
# never sees a packet. ipc_radio is nRF Connect SDK's HCI-over-IPC controller and
# these two symbols are what select it (workspace/nrf/sysbuild/Kconfig.netcore).
#
# No 802.15.4 here, unlike the Matter reader build: this app speaks BLE only, so
# the net-core image is the BT-only variant and the flash pressure measured on
# the reader's combined BT + 802.15.4 controller does not apply.
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
