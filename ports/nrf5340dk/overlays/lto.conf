# Link-time optimisation for the app core. Pass via `make nrf-build LTO=1`.
#
# OFF BY DEFAULT on this board, and that is a deliberate difference from the
# DWM3001CDK, where the same overlay is on by default (firmware/overlay-lto.conf).
# LTO is whole-program codegen on an image whose UWB ranging path has a ~1836 us
# arm deadline, and a smaller binary is no evidence whatever that the deadline
# still holds. The only check that can prove it is a walk-up unlock on hardware.
# That run cleared the CDK on 2026-08-02. Nothing has run it on the nRF5340 DK,
# so this stays opt-in until someone does, and the tap path (NFC, which only this
# board has) is unproven under LTO for the same reason.
#
# BOTH LINES BELOW ARE REQUIRED, and this is the trap worth knowing. `CONFIG_LTO=y`
# on its own is a silent no-op: the symbol depends on
#   !(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION
# (zephyr/Kconfig.zephyr:526-528, checked against the NCS v3.3.0 tree). With that
# dependency unmet Kconfig does not merely leave LTO off, it drops the symbol from
# the generated .config entirely, and emits no warning while doing it. Never trust
# a size number from this overlay without grepping
#   build/nrf5340dk/matter-aliro-door-lock-app/zephyr/.config
# for BOTH symbols.
#
# SCOPE, and why the win here is smaller than the CDK's. This rides
# EXTRA_CONF_FILE, which sysbuild applies to the application image alone: the
# ipc_radio net-core image is untouched, and so is Matter itself, because CHIP is
# built by its own GN invocation that never sees Zephyr's compile options. What is
# left for LTO to chew on is Zephyr, the drivers, the in-tree modules and the
# add-on's own C++, a minority of an image whose bulk is CHIP.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
