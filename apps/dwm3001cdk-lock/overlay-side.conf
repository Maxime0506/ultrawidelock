# Fail-closed INSIDE/OUTSIDE/THRESHOLD gate for passive approach unlock.
#
#   make build SIDE=1 CDK_BUILD=build/cdk-side
#
# Requires commissioned BLE witnesses feeding the lock. Without them, every
# passive unlock is withheld (fail-closed). NFC Express Mode and Apple Home
# commands are unchanged.
#
# Use SIDE=1 rather than rewriting CDK_CONF by hand (same trap as ANCHOR=1:
# dropping overlay-lto.conf costs ~41 KB).

CONFIG_WOZ_ANCHOR=y
CONFIG_WOZ_SIDE_GATE=y

CONFIG_WOZ_ANCHOR_BASELINE_MM=1200
CONFIG_WOZ_ANCHOR_TOL_MM=90
CONFIG_WOZ_ANCHOR_DEADBAND_MM=60
CONFIG_WOZ_ANCHOR_STALE_MS=1500
CONFIG_WOZ_ANCHOR_SELF_INSIDE=y
