# MCUboot as image 0 on the DWM3001CDK: a recovery floor, not an update system.
#
# One internal 512 KB flash and an app that already fills 86% of it means there
# is room for exactly ONE slot. That rules out atomic rollback and it rules out
# the Matter OTA Requestor, both of which need a second slot to stage into.
# Accepted deliberately: what this buys is that a board with a corrupt or absent
# application still comes up in a bootloader that will take a new one over the
# J-Link OB's VCOM, with no probe and no external hardware.
#
# NOTHING HERE MAY SET APPROTECT. Not SB_CONFIG_APPROTECT_LOCK, not
# SB_CONFIG_SECURE_APPROTECT_LOCK, and not the CONFIG_NRF_*APPROTECT_LOCK pair
# on any image. The lock re-asserts in SystemInit() on every boot and the only
# way out is `nrfjprog --recover`, which mass-erases flash AND UICR -- taking
# settings_storage and the reader private key with it. Every iPhone key already
# provisioned against this board dies with that key. NCS defaults to open;
# leaving it alone is the whole requirement. scripts/check-approtect.sh proves
# it against the GENERATED .config of every image, because the setting can also
# arrive from a board defconfig where no grep of this tree would find it.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# ECDSA-P256 rather than ED25519. MCUboot's ED25519 is hash-then-sign over
# SHA-512, so it pulls in a second hash implementation and pays flash for it;
# P-256 verifies over the SHA-256 that the image hash already requires.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
