# CIR capture overlay: collect labelled channel-impulse traces from a walk-up.
#
# Layered ON TOP of overlay-thread.conf, not instead of it. The capture wants a
# real Apple Wallet walk-up, and this board only advertises Aliro once Apple Home
# has commissioned it, so the capture image has to be the Matter image with the
# diagnostics added. `make cirdiag` builds exactly that; see mk/cdk.mk.
#
#   make cirdiag
#   make flash   CDK_BUILD=build/cdk-cirdiag     # NOT flash-erase: keep the credential
#   make monitor CDK_RTT_BUILD=build/cdk-cirdiag
#
# NOT A SHIPPING CONFIGURATION. Flash the ordinary image back when the capture
# run is done.
CONFIG_WOZ_UWB_CIRDIAG=y
CONFIG_ALIRO_CIRDIAG_CAPTURE=y

# Summary only. The windowed-CIR read does not merely cost latency on this board:
# measured 2026-08-07, an image with it armed never transmitted a Response at all
# (tx0, no range, no unlock, three sessions), while the plain image on the same
# board ranged 22-443 cm and unlocked. The accumulator read does not fit inside
# the ~1836 us arm deadline on this single core.
#
# Losing the taps costs almost nothing for the reason this capture exists:
# the whole tap-derived half of the feature set is worth 0.14 accuracy
# points (0.8625 -> 0.8611), because ~76% of the
# discriminating power is absolute received power, which is a register scalar.
#
# `make cirdiag CIRDIAG_WINDOWS=1` puts the windows back, for whoever wants to
# take the ranging apart rather than collect training data.
CONFIG_ALIRO_CIRDIAG_CAPTURE_WINDOWS=n

# Summary only was NOT enough on its own: measured 2026-08-07, an image latching
# the summary on every reception also never transmitted a Response (tx0, no
# range, no unlock, three sessions). The receiver only listens while a ranging
# session is armed (ccc_prepoll_listen, called from woz_uwb_facade.c), so a phone
# that stops getting unlocks stops the capture completely -- the diagnostics have
# to leave the round working or they collect nothing at all.
#
# So take one reception in eight and read only what the features use. A walk-up
# is hundreds of receptions and the model wants a few hundred per class total, so
# this still fills a training set from a handful of approaches.
CONFIG_WOZ_UWB_CIRDIAG_SUMMARY_EVERY=8
CONFIG_WOZ_UWB_CIRDIAG_SUMMARY_LEAN=y

# The drain writes 16 records x 64 taps, about 46 KB, into an 8 KB RTT buffer
# running NO_BLOCK_SKIP -- see apps/dwm3001cdk-lock/prj.conf for why BLOCK_IF_FIFO_FULL is
# not available on this board. Without pacing, most of the capture is discarded
# silently, and NO_BLOCK_SKIP discards the NEWEST writes, so the drain appears to
# succeed and simply stops. 40 ms per record keeps the reader ahead of the writer
# and costs about 0.6 s per cycle, off the ranging path.
CONFIG_WOZ_UWB_CIRDIAG_DRAIN_PACE_MS=40

# INF, not DBG. Everything this overlay exists to read is printk from
# uwb_cirdiag.c and so is not gated by the log level at all; raising the level
# further only floods the same 8 KB buffer the capture needs.
CONFIG_LOG_DEFAULT_LEVEL=3
