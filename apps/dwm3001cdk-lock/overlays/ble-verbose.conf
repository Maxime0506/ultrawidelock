# BENCH ONLY. Un-mutes the BLE and Matter-commissioning log lines.
#
# The shipping image reads ERR for everything in this path, from one cause:
# overlay-release.conf sets CONFIG_LOG_DEFAULT_LEVEL=1, and both module levels
# sit on ..._LOG_LEVEL_DEFAULT=y, so they follow it down. Raising the default
# alone would therefore be enough today. The two _INF lines are here anyway so
# that an overlay which later pins either module cannot silently re-mute this
# one; they cost a line each and remove a dependency on a default staying put.
#
# Assign the _INF symbols, never CONFIG_<module>_LOG_LEVEL. That one is an int
# with no prompt, computed from the choice, and writing it is a hard configure
# error rather than a warning:
#   error: WOZ_ALIRO_LOG_LEVEL ... is assigned in a configuration file, but is
#   not directly user-configurable (has no prompt).
#
# What it buys: "commissioning link up", "BTP up: fragment=N window=N",
# "BLE connected/disconnected", "BLE conn params: interval N ms" and
# "commissioning window open for N s". Without them a failed commissioning is
# a blank log between boot and the next error, so there is no way to tell a
# refused write from a write that never arrived.
#
# Append to CDK_CONF, keeping the whole default list (see
# overlays/thread-dataset-dump.conf for why overlay-lto.conf must stay in it):
#
#   make build SMP=1 RELEASE=1 \
#     CDK_CONF="overlay-thread.conf;overlay-release.conf;overlay-smp.conf;overlay-lto.conf;overlays/ble-verbose.conf"
#
# INF (3), not DBG (4), on purpose: the DBG lines in this path are
# LOG_HEXDUMP_DBG of every BTP fragment, which costs flash and buries the
# state transitions that answer the question. Go to 4 only once INF has
# narrowed it to the framing.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ALIRO_MATTER_BLE_LOG_LEVEL_INF=y
CONFIG_ULTRAWIDELOCK_CRED_LOG_LEVEL_INF=y
