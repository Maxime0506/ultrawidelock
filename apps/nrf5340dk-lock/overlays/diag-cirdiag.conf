# CIA/CIR diagnostics (channel-impulse): per-reception first-path summary plus the
# windowed CIR tap dump, for capturing labelled walk-ups. Layered by `make build CIR=1`.
#
# Off by default: while armed the window read costs walk-up latency, and it is only
# valid with the receiver idle (taken before the RX shim re-arms, one Final in four).
# Arm at runtime with `aliro cir on`, `aliro cir dump on`, `aliro cir probe`.
CONFIG_WOZ_UWB_CIRDIAG=y
