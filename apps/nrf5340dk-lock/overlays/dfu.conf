# App-image half of the DFU variant. Layered AFTER woz-aliro.conf by
# `make nrf-build DFU=1`, and it exists only to undo one line of it.
#
# woz-aliro.conf sets CONFIG_CHIP_BOOTLOADER_NONE=y, because with MCUboot dropped
# Matter's own bootloader choice would otherwise default to MCUBOOT and select
# IMG_MANAGER, whose dependencies are unmet with no mcuboot partition. With the
# bootloader back that reasoning inverts, so point the choice at MCUboot again.
#
# Both lines on purpose. These are two members of one Kconfig choice
# (modules/lib/matter/config/nrfconnect/chip-module/Kconfig:53-66), and clearing
# the old member as well as setting the new one keeps the merged .config
# unambiguous rather than relying on last-writer-wins between two fragments.
# CHIP_BOOTLOADER_MCUBOOT is what pulls IMG_MANAGER back in, which is what the
# OTA Requestor writes the downloaded image through.
CONFIG_CHIP_BOOTLOADER_NONE=n
CONFIG_CHIP_BOOTLOADER_MCUBOOT=y
