# Soak overlay: a long unattended run, and the logging it needs to be readable
# afterwards.
#
# Not in prj.conf, per this repo's convention: on a single-core part the extra
# logging is exactly the kind of thing that perturbs the delayed-TX window, so a
# diagnostic lives beside the app and is asked for by name.
#
#   make anchor-build ROLE=responder \
#     ANCHOR_BOARD=decawave_dwm3001cdk EXTRA=overlays/soak.conf
#
# (mk/anchor.mk has no EXTRA hook yet; pass it through west directly until a
# soak is actually being run, rather than adding a knob nobody has used.)

# An hour at 10 Hz is 36,000 rounds and 360 report lines. The 4 KB default ring
# holds only the last few, and the ring is NOINIT -- it survives a reset and
# accumulates, so on a full buffer NO_BLOCK_SKIP drops the NEWEST writes and the
# end of a soak is what goes missing. 8192 is the size the Thread gate run in
# this repo had to reach for the same reason.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# Timestamps, because the interesting soak failure is a step change in drop rate
# and a counter without a clock cannot say when it happened.
CONFIG_LOG_TIMESTAMP_64BIT=y

# Stack high-water evidence rather than a guess. This repo has taken three MPU
# stack-guard faults, each presenting as a hang; a soak is the cheapest place to
# find out that main()'s 2 KB is not enough for the SPI and 64-bit timestamp
# work it carries.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=300
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
